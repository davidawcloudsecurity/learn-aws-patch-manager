{
  "schemaVersion": "0.3",
  "description": "Assesses the readiness of EC2 instance against SSM patch prerequisites.",
  "assumeRole": "{{ AutomationAssumeRole }}",
  "parameters": {
    "InstanceId": {
      "type": "String",
      "description": "(Required) ID of your EC2 instance.",
      "allowedPattern": "^i-[a-f0-9]{8,17}$"
    },
    "AutomationAssumeRole": {
      "type": "String",
      "description": "(Required) The ARN of the role that allows Automation to perform the actions on your behalf.",
      "allowedPattern": "^arn:aws(-[a-z]+)*:iam::[0-9]{12}:role/[A-Za-z0-9_-]+$"
    },
    "AccelerateAccount": {
      "type": "Boolean",
      "description": "(Optional) Account Type.",
      "allowedValues": [
        true,
        false
      ],
      "default": true
    }
  },
  "mainSteps": [
    {
      "name": "getInstanceTagEnvironment",
      "nextStep": "branchOnDenyTagEnvironment",
      "action": "aws:executeAwsApi",
      "maxAttempts": 3,
      "timeoutSeconds": 180,
      "isCritical": true,
      "onFailure": "Abort",
      "inputs": {
        "Service": "ec2",
        "Api": "DescribeTags",
        "Filters": [
          {
            "Name": "resource-id",
            "Values": [
              "{{ InstanceId }}"
            ]
          },
          {
            "Name": "key",
            "Values": [
              "Environment"
            ]
          }
        ]
      },
      "outputs": [
        {
          "Name": "Value",
          "Selector": "$.Tags[0].Value",
          "Type": "String"
        }
      ]
    },
    {
      "name": "branchOnDenyTagEnvironment",
      "action": "aws:branch",
      "isEnd": true,
      "maxAttempts": 3,
      "timeoutSeconds": 180,
      "isCritical": true,
      "onFailure": "Abort",
      "inputs": {
        "Choices": [
          {
            "Not": {
              "Variable": "{{ getInstanceTagEnvironment.Value }}",
              "StringEquals": "AMSInfrastructure"
            },
            "NextStep": "waitforInstancetobeManagedInstance"
          }
        ]
      }
    },
    {
      "name": "waitforInstancetobeManagedInstance",
      "action": "aws:waitForAwsResourceProperty",
      "maxAttempts": 3,
      "timeoutSeconds": 120,
      "onFailure": "Abort",
      "inputs": {
        "Service": "ssm",
        "Api": "DescribeInstanceInformation",
        "InstanceInformationFilterList": [
          {
            "key": "InstanceIds",
            "valueSet": [
              "{{ InstanceId }}"
            ]
          }
        ],
        "PropertySelector": "$.InstanceInformationList[0].PingStatus",
        "DesiredValues": [
          "Online"
        ]
      },
      "isCritical": true,
      "nextStep": "runTestPatchPrerequisites"
    },
    {
      "name": "runTestPatchPrerequisites",
      "action": "aws:runCommand",
      "onFailure": "Abort",
      "maxAttempts": 2,
      "timeoutSeconds": 3600,
      "inputs": {
        "DocumentName": "AWSManagedServices-TestPatchingPrerequisites",
        "InstanceIds": [
          "{{ InstanceId }}"
        ],
        "OutputS3BucketName": "mc-a{{ global:ACCOUNT_ID }}-internal-{{ global:REGION }}",
        "OutputS3KeyPrefix": "aws/ssm/automation"
      },
      "outputs": [
        {
          "Name": "TestPatchPrereqCommandId",
          "Selector": "$.CommandId",
          "Type": "String"
        }
      ],
      "isCritical": true,
      "nextStep": "getInstancePlatform"
    },
    {
      "name": "getInstancePlatform",
      "action": "aws:executeAwsApi",
      "onFailure": "Abort",
      "timeoutSeconds": 60,
      "maxAttempts": 3,
      "nextStep": "getTestPatchPrerequisitesOutput",
      "inputs": {
        "Service": "ssm",
        "Api": "DescribeInstanceInformation",
        "Filters": [
          {
            "Key": "InstanceIds",
            "Values": [
              "{{ InstanceId }}"
            ]
          }
        ]
      },
      "outputs": [
        {
          "Name": "Platform",
          "Selector": "$.InstanceInformationList[0].PlatformType",
          "Type": "String"
        }
      ]
    },
    {
      "name": "getTestPatchPrerequisitesOutput",
      "action": "aws:executeScript",
      "onFailure": "Abort",
      "isCritical": true,
      "maxAttempts": 1,
      "timeoutSeconds": 60,
      "inputs": {
        "InputPayload": {
          "CommandId": "{{ runTestPatchPrerequisites.TestPatchPrereqCommandId }}",
          "AccelerateAccount": "{{ AccelerateAccount }}",
          "Platform": "{{ getInstancePlatform.Platform }}"
        },
        "Script": "import json\nimport re\n\nimport boto3\n\nssm_client = boto3.client(\"ssm\")\n\n\ndef script_handler(event, context):\n    skipped_step_regex = r\"^Step execution skipped\"\n    json_regex = re.compile(r\"\\{(?:[^{}]|(\\{(?:[^{}]|())*\\}))*\\}\")\n    invocations = ssm_client.list_command_invocations(CommandId=event[\"CommandId\"], Details=True)\n    for invocation in invocations[\"CommandInvocations\"]:\n        for plugin_details in invocation[\"CommandPlugins\"]:\n            command_invocation = ssm_client.get_command_invocation(\n                CommandId=event[\"CommandId\"],\n                InstanceId=invocation[\"InstanceId\"],\n                PluginName=plugin_details[\"Name\"],\n            )\n            plugin_output = command_invocation.get(\"StandardOutputContent\")\n            if not re.match(skipped_step_regex, plugin_output):\n                plugin_json_output = json.loads(json_regex.search(plugin_output).group())\n                plugin_json_output = plugin_json_output.get(\"Content\", plugin_json_output)\n                if event[\"Platform\"] == \"Linux\":\n                    precheck_output = get_linux_precheck(\n                        plugin_json_output, AccelerateAccount=event[\"AccelerateAccount\"]\n                    )\n                elif event[\"Platform\"] == \"Windows\":\n                    precheck_output = get_windows_precheck(\n                        plugin_json_output, AccelerateAccount=event[\"AccelerateAccount\"]\n                    )\n                else:\n                    precheck_output = \"Failed\"\n                if event[\"AccelerateAccount\"] is True:\n                    del plugin_json_output[\"AdBindingValidation\"]\n                return {\n                    \"PluginName\": plugin_details.get(\"Name\"),\n                    \"Precheck\": precheck_output,\n                    \"Status\": plugin_details.get(\"Status\"),\n                    \"AmspatchInventory\": plugin_json_output,\n                }\n\n\ndef get_linux_precheck(plugin_json_output, AccelerateAccount):\n    # Define acceptable values for UpdateServiceConfigurationStatus\n    acceptable_update_service_statuses = {\n        \"Healthy\",\n        \"RHEL RHUI configuration is healthy.\",\n        \"RHEL subscription manager is healthy.\",\n    }\n\n    # Define acceptable values for hybrid instances\n    acceptable_metadata_statuses = {\"Reachable\", \"Hybrid Instance - Skipped\"}\n    acceptable_credentials_statuses = {\"Success\", \"Hybrid Instance - using IAM role\"}\n\n    if (\n        plugin_json_output[\"UpdateServiceConfigurationStatus\"]\n        not in acceptable_update_service_statuses\n    ):\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"Ec2MetadataServiceStatus\"] not in acceptable_metadata_statuses:\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"VolumeSpaceCriteria\"] != \"Meet\":\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"DataCorruptionFileSystemErrorsCheck\"] != \"No Errors Detected\":\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"AwsCredentialsStatusCode\"] not in acceptable_credentials_statuses:\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"RepositoriesEnabled\"] == \"\":\n        Precheck = \"Failed\"\n    elif (\n        AccelerateAccount is False\n        and plugin_json_output[\"AdBindingValidation\"] != \"Validation succeeded\"\n    ):\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"PackageManagerDryRunResult\"] != \"Succeeded\":\n        Precheck = \"Failed\"\n    else:\n        Precheck = \"Passed\"\n    return Precheck\n\n\ndef get_windows_precheck(plugin_json_output, AccelerateAccount):\n    # Define acceptable values for hybrid instances\n    acceptable_metadata_statuses = {\"Reachable\", \"Hybrid Instance - IMDS not applicable\"}\n    acceptable_credentials_statuses = {\"Success\", \"Hybrid Instance - using IAM role\"}\n\n    if plugin_json_output[\"UpdateServiceConfigurationStatus\"] != \"Healthy\":\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"DataCorruptionFileSystemErrorsCheck\"] != \"No Errors Detected\":\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"Ec2MetadataServiceStatus\"] not in acceptable_metadata_statuses:\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"VolumeSpaceCriteria\"] != \"Meet\":\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"AwsCredentialsStatusCode\"] not in acceptable_credentials_statuses:\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"WindowsUpdateServiceStartMode\"] not in [\n        \"Manual\",\n        \"Automatic\",\n    ]:\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"WindowsFirewallServiceStatus\"] != \"Running\":\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"WindowsUpdateEndpointsReachability\"] != \"Windows Update is reachable.\":\n        Precheck = \"Failed\"\n    elif (\n        AccelerateAccount is False\n        and plugin_json_output[\"AdBindingValidation\"] != \"All ok instance is part of an AD domain\"\n    ):\n        Precheck = \"Failed\"\n    elif plugin_json_output[\"WindowsFirewallServiceStartMode\"] != \"Automatic\":\n        Precheck = \"Failed\"\n    else:\n        Precheck = \"Passed\"\n    return Precheck\n",
        "Handler": "script_handler",
        "Runtime": "python3.11"
      },
      "outputs": [
        {
          "Name": "Payload",
          "Selector": "$.Payload",
          "Type": "StringMap"
        }
      ],
      "isEnd": true
    }
  ],
  "outputs": [
    "getTestPatchPrerequisitesOutput.Payload"
  ]
}