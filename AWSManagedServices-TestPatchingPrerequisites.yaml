          "        \"ap-southeast-3\") echo \"aa48fc462\" ;; # CGK",
          "        \"eu-west-3\") echo \"29bf85721\" ;;     # CDG",
          "        \"af-south-1\") echo \"bdd5f65a9\" ;;    # CPT",
          "        \"ap-east-1\") echo \"632356271\" ;;     # HKG",
          "        \"ap-northeast-3\") echo \"67373598a\" ;; # KIX",
          "        \"me-central-1\") echo \"2932f2f80\" ;;  # DXB",
