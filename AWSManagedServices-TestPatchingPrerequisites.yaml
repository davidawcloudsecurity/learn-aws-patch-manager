          "}",
          "",
          "function Check-WSUSConnectivity {",
          "   <#",
          "   .SYNOPSIS",
          "       Gets Connectivity Status for WSUS Server if configured.",
          "   .DESCRIPTION",
          "       Returns WSUS Server Connectivity.",
          "   .EXAMPLE",
          "       Check-WSUSConnectivity",
          "   #>",
          "   ",
          "   $registryPath = \"HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\"",
          "   ",
          "   if (Test-Path $registryPath) {",
          "       try {",
          "           # Get the WSUS server URL from the registry",
          "           $wsusServer = (Get-ItemProperty -Path $registryPath -Name \"WUServer\" -ErrorAction Stop).WUServer",
          "           ",
          "           if ([string]::IsNullOrEmpty($wsusServer)) {",
          "               $Connectivity = \"WSUS server URL is not configured in the registry.\"",
          "           } else {",
          "               # Test connectivity to the WSUS server URL",
          "               $response = Invoke-WebRequest -Uri $wsusServer -UseBasicParsing -ErrorAction Stop",
          "               $Connectivity = \"WSUS server connectivity test successful. Response code: $($response.StatusCode)\"",
          "           }",
          "       } catch {",
          "           $Connectivity = \"Failed to connect to WSUS server. Error: $($_.Exception.Message)\"",
          "       }",
          "   } else {",
          "       $Connectivity = \"WSUS registry settings not found. Check if WSUS is configured on this machine.\"",
          "   }",
          "   ",
          "   return $Connectivity",
          "}",
          "",
          "function Test-WSUSServerIfPresent{",
          "          <#",
          "       .SYNOPSIS",
          "          Gets WSUS Server Connectivity Status if Use WSUS Server is Configured.",
          "       .DESCRIPTION",
          "          Returns WSUS Server Connectivity if Use WSUS Server is Configured .",
          "       .EXAMPLE",
          "          Test-WSUSServerIfPresent",
          "    #>",
          "   $WuaRegistryKeysState = Get-RegistryWuaDisabled",
          "   ",
          "   if($WuaRegistryKeysState.UseWuserver -eq 1){",
          "      $WSUSStatus= Check-WSUSConnectivity",
          "   }",
          "   else{",
          "      $WSUSStatus=  \"Use WSUS Server is not configured on this machine\"  ",
          "   }",
          "",
          "   return $WSUSStatus",
          "}",
          "",
          "function CollectDataAndCreateInventoryFile {",
          "    <#",
          "      .SYNOPSIS",
          "         Collects data and create the inventory file",
          "      .DESCRIPTION",
          "         Metadata access, security credentials and windows components state are collected and save in a JSON file for SSM inventory collection.",
          "      .EXAMPLE",
          "         Get-WindowsUpdateConnectivity",
          "   #>",
          "   $MetadataAccessAndCredentials = Get-MetadataStatusAndSecurityCredentials",
          "   $MetadataAccess = $MetadataAccessAndCredentials.metadata",
          "   $SecurityCredentials = $MetadataAccessAndCredentials.securitycredentials",
          "   $VolumeSpaceCriteria = Get-CdriveSpace",
          "   $UpdateServiceConfigState = Get-UpdateServiceConfigState",
          "   $DataCorruptionDiskErrorsState = Get-DataCorruptionDiskErrorsEventLog",
          "   $WindowsProxySettings = Get-ProxySettings",
          "   $Connectivity = Get-WindowsUpdateConnectivity",
          "   $ServiceState = Get-WuaAndWinFirewallServiceStatus",
          "   $WuaRegistryKeysState = Get-RegistryWuaDisabled",
          "   $AdBindingStatus = Get-AdBindingStatus",
          "   $WinhttpAutoProxy = Get-WinhttpAutoProxy",
          "   $SupportedOS = Test-SupportedOS",
          "   $S3EndpointConnectivity = Test-S3EndpointConnectivity",
          "   $CommandIdUrl = Get-SsmCommandUrl",
          "   $DisableWua = [string]$WuaRegistryKeysState.DisableWua",
          "   if ([string]::IsNullOrEmpty($DisableWua)) {",
          "      $DisableWua = \"Value not present\"",
          "   }",
          "   $UseWuserver = [string]$WuaRegistryKeysState.UseWuserver",
          "   if ([string]::IsNullOrEmpty($UseWuserver)) {",
          "      $UseWuserver = \"Value not present\"",
          "   }",
          "   $TLSVersionEnabled = Test-TLSVersionEnabled",
          "   $WMIRepositoryStatus = Test-WMIRepository",
          "   $WSUSServerReachability = Test-WSUSServerIfPresent",
          "   $AutoUpdateStatus = Check-AutoUpdate",
          "   $ESUStatus = Test-ESUStatus",
          "",
          "   [hashtable]$AmsPatchSchema = @{}",
          "   [hashtable]$AmsPatchContent = @{}",
          "",
          "   $Date = [DateTime]::UtcNow.ToString('yyyy-MM-%dT%H:mm:ssZ')",
          "   $AmsPatchSchema.SchemaVersion = \"9.0\"",
          "   $AmsPatchSchema.CaptureTime = $Date",
          "   $AmsPatchSchema.TypeName = \"Custom:AmsPatchConfiguration\"",
          "   $AmsPatchContent.UpdateServiceConfigurationStatus = $UpdateServiceConfigState",
          "   $AmsPatchContent.DataCorruptionFileSystemErrorsCheck = $DataCorruptionDiskErrorsState",
          "   $AmsPatchContent.PackageManagerCorruptionCheck = \"N/A\"",
          "   $AmsPatchContent.Ec2MetadataServiceStatus = $MetadataAccess",
          "   $AmsPatchContent.WindowsUpdateServiceStartMode = $ServiceState.WuaStartMode",
          "   $AmsPatchContent.WindowsFirewallServiceStartMode = $ServiceState.WinFWStartMode",
          "   $AmsPatchContent.WindowsFirewallServiceStatus = $ServiceState.WinFWSsStatus",
          "   $AmsPatchContent.WindowsProxyStatus = $WindowsProxySettings",
          "   $AmsPatchContent.VolumeSpaceCriteria = [string]$VolumeSpaceCriteria.result",
          "   $AmsPatchContent.RootVolumeSpace = [string]$VolumeSpaceCriteria.space",
          "   $AmsPatchContent.AwsCredentialsStatusCode = $SecurityCredentials",
          "   $AmsPatchContent.DisableWuaRegKey = $DisableWua",
          "   $AmsPatchContent.UseWuServerRegKey = $UseWuserver",
          "   $AmsPatchContent.WindowsUpdateEndpointsReachability = $Connectivity",
          "   $AmsPatchContent.AdBindingValidation = $AdBindingStatus",
          "   $AmsPatchContent.WinhttpAutoProxy = $WinhttpAutoProxy ",
          "   $AmsPatchContent.S3EndpointConnectivity = $S3EndpointConnectivity",
          "   $AmsPatchContent.CommandIdUrl = $CommandIdUrl",
          "   $AmsPatchContent.TLSVersionEnabled = $TLSVersionEnabled",
          "   $AmsPatchContent.WSUSServerReachability = $WSUSServerReachability ",
          "   $AmsPatchContent.WMIRepositoryStatus = $WMIRepositoryStatus",
          "   $AmsPatchContent.AutoUpdateStatus = $AutoUpdateStatus",
          "   $AmsPatchContent.ExtendedSecurityUpdateStatus = $ESUStatus",
          "   $AmsPatchContent.VarLogSpace = \"N/A\"",
          "   $AmsPatchContent.VarCacheSpace = \"N/A\"",
          "   $AmsPatchContent.BootVolumeSpace = \"N/A\"",
          "   $AmsPatchContent.RepositoriesEnabled = \"N/A\"",
          "   $AmsPatchContent.PackageManagerProxyCheck = \"N/A\"",
          "   $AmsPatchContent.PackageManagerDryRunResult = \"N/A\"",
          "   $AmsPatchContent.ObsoletePackages = \"N/A\"",
          "   $AmsPatchContent.DuplicatePackages = \"N/A\"",
          "   $AmsPatchContent.ELSStatus = \"N/A\"",
          "   $AmsPatchContent.FoundPythonVersion = \"N/A\" ",
          "   $AmsPatchContent.VersionLockStatus = \"N/A\"",
          "   $AmsPatchContent.ExcludeParameterStatus = \"N/A\"",
          "   $AmsPatchContent.PackageManagerReleaseverStatus = \"N/A\" ",
          "   $AmsPatchSchema.Content = $AmsPatchContent",
          "   $CustomInventoryContent = $AmsPatchSchema | ConvertTo-Json",
          "",
          "   if ($CustomInventoryEnabled){",
          "      $filepath = \"C:\\ProgramData\\Amazon\\SSM\\InstanceData\\$env:AWS_SSM_INSTANCE_ID\\inventory\\custom\\CustomAmsPatchInventory.json\"",
          "      Set-Content -Path $filepath -Value $CustomInventoryContent",
          "   }",
          "",
          "   Write-Output $CustomInventoryContent",
          "}",
          "",
          "CollectDataAndCreateInventoryFile"
        ]
      }
    },
    {
      "action": "aws:runShellScript",
      "name": "linuxPrerequisites",
      "precondition": {
        "StringEquals": [
          "platformType",
          "Linux"
        ]
      },
      "inputs": {
        "timeoutSeconds": 3600,
        "runCommand": [
          "#!/bin/bash",
          "set -euo pipefail",
          "",
          "# Call script to detect the operating system and its version.",
          "# Managed function",
          "#!/usr/bin/env bash",
          "# Script to detect the operating system and its version.",
          "",
          "set -euo pipefail",
          "",
          "# Function to detect the operating system and its version.",
          "function DETECT_OS_VERSION() {",
          "    if [[ -f /etc/os-release ]]; then",
          "        # Source the os-release file to access system information.",
          "        source /etc/os-release",
          "        case \"$ID\" in",
          "            amzn)",
          "                case \"$VERSION_ID\" in",
          "                    \"2018.03\") echo \"AMAZON_LINUX_1\" ;;",
          "                    \"2\") echo \"AMAZON_LINUX_2\" ;;",
          "                    \"2023\") echo \"AMAZON_LINUX_3\" ;;",
          "                    *) echo \"UNKNOWN\" ;;",
          "                esac",
          "                ;;",
          "            almalinux)",
          "                case \"$VERSION_ID\" in",
          "                    8*) echo \"ALMA_8\" ;;",
          "                    9*) echo \"ALMA_9\" ;;",
          "                    10*) echo \"ALMA_10\" ;;",
          "                    *) echo \"UNKNOWN\" ;;",
          "                esac",
          "                ;;",
          "            rhel)",
          "                case \"$VERSION_ID\" in",
          "                    7*) echo \"RHEL_7\" ;;",
          "                    8*) echo \"RHEL_8\" ;;",
          "                    9*) echo \"RHEL_9\" ;;",
          "                    10*) echo \"RHEL_10\" ;;",
          "                    *) echo \"UNKNOWN\" ;;",
          "                esac",
          "                ;;",
          "            centos)",
          "                case \"$VERSION_ID\" in",
          "                    6*) echo \"CENTOS_6\" ;;",
          "                    7*) echo \"CENTOS_7\" ;;",
          "                    8*) echo \"CENTOS_8\" ;;",
          "                    9*) echo \"CENTOS_9\" ;;",
          "                    10*) echo \"CENTOS_10\" ;;",
          "                    *) echo \"UNKNOWN\" ;;",
          "                esac",
          "                ;;",
          "            ol)",
          "                case \"$VERSION_ID\" in",
          "                    7*) echo \"ORACLE_LINUX_7\" ;;",
          "                    8*) echo \"ORACLE_LINUX_8\" ;;",
          "                    9*) echo \"ORACLE_LINUX_9\" ;;",
          "                    10*) echo \"ORACLE_LINUX_10\" ;;",
          "                    *) echo \"UNKNOWN\" ;;",
          "                esac",
          "                ;;",
          "            sles)",
          "                case \"$VERSION_ID\" in",
          "                    12*) echo \"SLES_12\" ;;",
          "                    15*) echo \"SLES_15\" ;;",
          "                    *) echo \"UNKNOWN\" ;;",
          "                esac",
          "                ;;",
          "            ubuntu)",
          "                case \"$VERSION_ID\" in",
          "                    14*) echo \"UBUNTU_14\" ;;",
          "                    16*) echo \"UBUNTU_16\" ;;",
          "                    18*) echo \"UBUNTU_18\" ;;",
          "                    20*) echo \"UBUNTU_20\" ;;",
          "                    22*) echo \"UBUNTU_22\" ;;",
          "                    23*) echo \"UBUNTU_23\" ;;",
          "                    24*) echo \"UBUNTU_24\" ;;",
          "                    *) echo \"UNKNOWN\" ;;",
          "                esac",
          "                ;;",
          "            *)",
          "                echo \"UNKNOWN\"",
          "                ;;",
          "        esac",
          "    elif [[ -f /etc/redhat-release ]]; then",
          "        # Read the contents of the redhat-release file for further analysis of OS detection.",
          "        DIST=$(cat /etc/redhat-release)",
          "        # Check for CentOS 6 or RHEL 6.",
          "        if [[ \"$DIST\" =~ ^CentOS\\ release\\ 6.* ]]; then",
          "            echo \"CENTOS_6\"",
          "        elif [[ \"$DIST\" =~ ^Red\\ Hat\\ Enterprise\\ Linux\\ Server\\ release\\ 6.* ]]; then",
          "            echo \"RHEL_6\"",
          "        # Check for Unsupported OS, CentOS 5 or RHEL 5.",
          "        elif [[ \"$DIST\" =~ ^Red\\ Hat\\ Enterprise\\ Linux\\ Server\\ release\\ 5.* ]]; then",
          "            echo \"UNSUPPORTED_OS: RHEL 5 is not supported\"",
          "        elif [[ \"$DIST\" =~ ^CentOS\\ release\\ 5.* ]]; then",
          "            echo \"UNSUPPORTED_OS: CENTOS 5 is not supported\"",
          "        else",
          "            echo \"UNKNOWN\"",
          "        fi",
          "    else",
          "        echo \"UNKNOWN\"",
          "    fi",
          "}",
          "",
          "readonly METADATAURL=\"http://169.254.169.254/latest\"",
          "readonly CUSTOM_INVENTORY_STATUS=\"{{ customInventory }}\"",
          "# Collect environment variables efficiently",
          "ENV_OUTPUT=$(env)",
          "AWS_SSM_REGION_NAME=$(echo \"$ENV_OUTPUT\" | grep \"^AWS_SSM_REGION_NAME=\" | cut -d'=' -f2) || AWS_SSM_REGION_NAME=\"\"",
          "AWS_SSM_INSTANCE_ID=$(echo \"$ENV_OUTPUT\" | grep \"^AWS_SSM_INSTANCE_ID=\" | cut -d'=' -f2) || AWS_SSM_INSTANCE_ID=\"\"",
          "SSM_COMMAND_ID=$(echo \"$ENV_OUTPUT\" | grep \"^SSM_COMMAND_ID=\" | cut -d'=' -f2) || SSM_COMMAND_ID=\"\"",
          "",
          "# Initialize status variables",
          "YUMUPDATESTATUS=\"Skipped\"",
          "OBSOLETE_PACKAGES=\"Skipped\"",
          "DUPLICATE_PACKAGES=\"Skipped\"",
          "ELS_STATUS=\"Skipped\"",
          "RELEASER_STATUS=\"Skipped\"",
          "",
          "# S3 CONNECTIVITY ENHANCEMENT",
          "# PROBLEM: Previous implementation used single hardcoded S3 URLs per region, causing:",
          "#   - Single point of failure if specific bucket was unavailable",
          "#   - No redundancy or fallback mechanism",
          "#   - Limited coverage for new AWS regions",
