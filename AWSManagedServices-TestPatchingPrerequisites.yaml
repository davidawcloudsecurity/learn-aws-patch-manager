{
  "schemaVersion": "2.2",
  "description": "SSM run command document assesses the readiness of EC2 instance against SSM patch prerequisites.",
  "parameters": {
    "customInventory": {
      "type": "String",
      "default": "Enabled",
      "description": "(Optional) Collect data for custom inventory.",
      "allowedValues": [
        "Enabled",
        "Disabled"
      ]
    }
  },
  "mainSteps": [
    {
      "action": "aws:runPowerShellScript",
      "name": "windowsPrerequisites",
      "precondition": {
        "StringEquals": [
          "platformType",
          "Windows"
        ]
      },
      "inputs": {
        "timeoutSeconds": 3600,
        "runCommand": [
          "$MetadataUrl = \"http://169.254.169.254/latest\"",
          "$CustomInventoryEnabled = \"{{ customInventory }}\" -eq \"Enabled\"",
          "# Optimize environment variable collection",
          "$awsSsmRegionName = [System.Environment]::GetEnvironmentVariable(\"AWS_SSM_REGION_NAME\")",
          "$awsSsmInstanceId = [System.Environment]::GetEnvironmentVariable(\"AWS_SSM_INSTANCE_ID\")",
          "$ssmCommandId = [System.Environment]::GetEnvironmentVariable(\"SSM_COMMAND_ID\")",
          "",
          "function Test-HybridInstance {",
          "   <#",
          "   .SYNOPSIS",
          "       Detects if the instance is a hybrid (managed) instance.",
          "   .DESCRIPTION",
          "       Checks if the AWS_SSM_INSTANCE_ID starts with 'mi-' to identify hybrid instances.",
          "   .EXAMPLE",
          "       Test-HybridInstance",
          "   #>",
          "   ",
          "   if ($awsSsmInstanceId -and $awsSsmInstanceId.StartsWith(\"mi-\")) {",
          "       return $true",
          "   }",
          "   return $false",
          "}",
          "     ",
          "function Get-WuaAndWinFirewallServiceStatus {",
          "   <#",
          "      .SYNOPSIS",
          "         Assess status of the windows update properties",
          "      .DESCRIPTION",
          "         Preqrequisite for the execution of the SSM patch scan/installation document execution",
          "      .EXAMPLE",
          "         Get-WuaAndWinFirewallServiceStatus",
          "   #>",
          "   [hashtable]$WuaStateAndDependency = @{}",
          "   # Windows update dependency on Remote Procedure Call service variable assingment. Also fetches data about the Windows Firewall service (Running, Auto Start)",
          "   $WUAUSERV_Service = Get-Service -Name 'wuauserv'",
          "   $RPCS_NAME_Service = Get-Service -Name 'RpcSs'",
          "   $WinFW_NAME_Service = Get-Service -Name 'mpssvc'",
          "",
          "   # Get status details from Windows Firewall (mpssvc), Windows Update (wua) and dependencies",
          "   [string]$WuaStateAndDependency.WuaStartMode = $WUAUSERV_Service.StartType",
          "   [string]$WuaStateAndDependency.RpcSsStatus = $RPCS_NAME_Service.Status",
          "   [string]$WuaStateAndDependency.WinFWSsStatus = $WinFW_NAME_Service.Status",
          "   [string]$WuaStateAndDependency.WinFWStartMode = $WinFW_NAME_Service.StartType",
          "",
          "   $WuaStateAndDependency.result = \"Healthy\"",
          "",
          "   if ($WuaStateAndDependency.RpcSsStatus -ne \"Running\" -or $WuaStateAndDependency.WuaStartMode -eq \"Disabled\" -or $WinFW_NAME_Service.Status -ne \"Running\" -or $WinFW_NAME_Service.StartType -ne \"Automatic\" ){",
          "      $WuaStateAndDependency.result = \"Not Healthy\"",
          "   }",
          "",
          "   return $WuaStateAndDependency",
          "}",
          "",
          "function Get-RegistryWuaDisabled {",
          "   <#",
          "      .SYNOPSIS",
          "         Assess status of the windows update properties",
          "      .DESCRIPTION",
          "         Preqrequisite for the executio nof the SSM patch scan/installation document execution",
          "      .EXAMPLE",
          "         Get-RegistryWuaDisabled ",
          "   #>",
          "",
          "   [hashtable]$WuaRegkeyState = @{}",
          "   $windowsUpdateKey = 'HKLM:\\Software\\Policies\\Microsoft\\Windows\\WindowsUpdate'",
          "   $wuaAutomaticUpdate = 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU'",
          "   $DisbaleWuaRegKeyName = 'DisableWindowsUpdateAccess'",
          "   $UseWuserverRegKeyName = 'UseWUServer'",
          "   ",
          "   $WuaRegkeyState.DisableWua = (Get-ItemProperty -Path $windowsUpdateKey -ErrorAction SilentlyContinue | Where-Object {$_.$DisbaleWuaRegKeyName -eq 1}).DisableWindowsUpdateAccess",
          "   $WuaRegkeyState.UseWuserver =  (Get-ItemProperty -Path $wuaAutomaticUpdate -ErrorAction SilentlyContinue | Where-Object {$_.$UseWuserverRegKeyName -eq 1}).UseWUServer",
          "",
          "   return $WuaRegkeyState",
          "}",
          "",
          "function Get-UpdateServiceConfigState {",
          "   $WuaServiceState = Get-WuaAndWinFirewallServiceStatus",
          "   $WuaRegistryKeysState = Get-RegistryWuaDisabled",
          "   $UpdateServiceConfig = \"Healthy\"",
          "",
          "   if ($WuaServiceState.result -ne \"Healthy\" -or $WuaRegistryKeysState.UseWuserver -eq 1 -or $WuaRegistryKeysState.DisableWua -eq 1){",
          "      $UpdateServiceConfig = \"Not Healthy\"",
          "   }",
          "",
          "   return $UpdateServiceConfig",
          "}",
          "",
          "function Get-DataCorruptionDiskErrorsEventLog {",
          "    <#",
          "      .SYNOPSIS",
          "         Checks any errors related to data corruption or filesystems",
          "      .DESCRIPTION",
          "         Preqrequisite for the execution of the SSM patch scan/installation document execution",
          "      .EXAMPLE",
          "         Get-EventLog",
          "   #>   ",
          "   $DateDiskEventLogs55 = Get-EventLog -LogName System -After (Get-Date).AddHours(-24) -Source Ntfs -EntryType Error -ErrorAction SilentlyContinue | Where-Object {$_.InstanceID -eq \"55\"} | Format-Table -HideTableHeaders",
          "   $DateDiskEventLogs98 = Get-EventLog -LogName System -After (Get-Date).AddHours(-24) -Source Microsoft-Windows-Ntfs -EntryType Error -ErrorAction SilentlyContinue | Where-Object {$_.InstanceID -eq \"98\"} | Format-Table -HideTableHeaders",
          "   $DateDiskEventLogsCheck = \"No Errors Detected\"",
          "   if (($DateDiskEventLogs55) -or ($DateDiskEventLogs98)){",
          "        $DateDiskEventLogsCheck = \"Errors Detected\";",
          "    }",
          "   ",
          "   return $DateDiskEventLogsCheck",
          "}",
          "",
          "function Get-CdriveSpace {",
          "   <#",
          "      .SYNOPSIS",
          "         Check C drive size.",
          "      .DESCRIPTION",
          "         Evaluates if reccomended space for patch installation is available",
          "      .EXAMPLE",
          "         Get-CdriveSpace",
          "   #>",
          "",
          "   # Get C drive space and size",
          "   $FreeCDriveSpace = (Get-CimInstance -ClassName Win32_LogicalDisk -Filter \"DeviceID='C:'\").FreeSpace",
          "   $FreeDriveSize = (Get-CimInstance -ClassName Win32_LogicalDisk -Filter \"DeviceID='C:'\").Size",
          "",
          "   [hashtable]$SpaceCriteria = @{}",
          "   $SpaceCriteria.result = \"Meet\"",
          "   $BytesFree = $FreeDriveSize - $FreeCDriveSpace",
          "   $PercentFree = ($BytesFree / $FreeDriveSize) * 100",
          "   $RecommendedDiskSpace = 10000000000",
          "   $SpaceCriteria.space = [math]::Round($FreeCDriveSpace / 1Mb)",
          "",
          "   if ($RecommendedDiskSpace -gt $FreeCDriveSpace) {",
          "      $SpaceCriteria.result = \"Not Meet\"",
          "   }",
          "   return $SpaceCriteria",
          "}",
          "",
          "function Get-MetadataStatusAndSecurityCredentials {",
          "   <#",
          "      .SYNOPSIS",
          "         Check metadata and security credentials access",
          "      .DESCRIPTION",
          "         This will get metadata response and security credentials for both EC2 and hybrid instances",
          "      .EXAMPLE",
          "         Get-MetadataStatusAndSecurityCredentials",
          "   #>",
          "   ",
          "   [hashtable]$Response = @{}",
          "   ",
          "   # Check if this is a hybrid instance",
          "   if (Test-HybridInstance) {",
          "       Write-Host \"Detected Hybrid Instance\"",
          "       $Response.metadata = \"Hybrid Instance - IMDS not applicable\"",
          "       $Response.securitycredentials = \"Hybrid Instance - using IAM role\"",
          "       $Response.token = $null",
          "   } else {",
          "       Write-Host \"Detected EC2 Instance\"",
          "       # Original EC2 metadata logic",
          "       $Response.metadata = \"Unreachable\"",
          "       $Response.securitycredentials = \"Failed\"",
          "       ",
          "       try {",
          "           [string]$token = Invoke-RestMethod -Headers @{\"X-aws-ec2-metadata-token-ttl-seconds\" = \"60\"} -Method PUT -Uri \"$MetadataUrl/api/token\" -TimeoutSec 10",
          "           $Response.token = $token",
          "           ",
          "           if ($token) {",
          "               $Response.metadata = \"Reachable\"",
          "               $iam_role = (Invoke-RestMethod -Headers @{\"X-aws-ec2-metadata-token\" = $token} -Method GET -Uri \"$MetadataUrl/meta-data/iam/security-credentials\" -TimeoutSec 10).ToString()",
          "               $Response.securitycredentials = (Invoke-RestMethod -Headers @{\"X-aws-ec2-metadata-token\" = $token} -Method GET -Uri \"$MetadataUrl/meta-data/iam/security-credentials/$iam_role\" -TimeoutSec 10).Code",
          "           }",
          "       } catch {",
          "           # Keep default values for failed EC2 metadata access",
          "       }",
          "   }",
          "   ",
          "   return $Response",
          "}",
          "",
          "# Helper that resolves windows update endpoints domains",
          "function Get-IPAddress {",
          "   <#",
          "      .SYNOPSIS",
          "      Gets the IP address(es) for a URL.",
          "      .DESCRIPTION",
          "      Gets the IP address(es) for a URL.",
          "      .EXAMPLE",
          "      Get-IPAddress -Url http://www.amstest.com",
          "   #>",
          "",
          "   [CmdletBinding()]",
          "   [OutputType([string[]])]",
          "   Param (",
          "       [Parameter(Mandatory=$true, HelpMessage='The URL to get the IP address for.')]",
          "       [ValidateNotNullOrEmpty()]",
          "       [System.Uri]$Url",
          "   )",
          "   $addresses = [string[]]@()",
          "   $dnsResults = $null",
          "   $dnsResults = @(Resolve-DnsName -Name $Url.Host -NoHostsFile -Type A_AAAA -QuickTimeout -ErrorAction SilentlyContinue | Where-Object {$_.Type -eq 'A'})",
          "   $addresses = [string[]]@($dnsResults | ForEach-Object { try { $_.IpAddress } catch [System.Management.Automation.PropertyNotFoundException] {} }) # IpAddress results in a PropertyNotFoundException when a URL is blocked upstream",
          "   return $addresses",
          "}",
          "",
          "",
          "function Get-HttpConnectivity {",
          "   <#",
          "     .SYNOPSIS",
          "         Test Windows endpoints connectivity",
          "     .DESCRIPTION",
          "         Gets HTTP Connectivity information for a URL.",
          "     .EXAMPLE",
          "         Get-HttpConnectivity -TestUrl http://www.amstest.com",
          "   #>",
          "   ",
          "   [CmdletBinding()]",
          "   [OutputType([void])]",
          "   Param(",
          "       [Parameter(Mandatory=$true, HelpMessage='The URL to test.')]",
          "       [ValidateNotNullOrEmpty()]",
          "       [Uri]$TestUrl,",
          "       [Parameter(Mandatory=$false, HelpMessage='The HTTP user agent. Defaults to the Chrome browser user agent.')]",
          "       [ValidateNotNullOrEmpty()]",
          "       [string]$UserAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.110 Safari/537.36'",
          "   )",
          "",
          "   [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls11",
          "   ",
          "   if ($TestUrl.OriginalString.ToLower().StartsWith('http://') -or $TestUrl.OriginalString.ToLower().StartsWith('https://')) {",
          "       $testUri = $TestUrl",
          "   } else {",
          "       $testUri = [Uri]('http://{0}' -f $TestUrl.OriginalString)",
          "   }",
          "   $proxyUri = [Net.WebRequest]::GetSystemWebProxy().GetProxy($testUri)",
          "   $request = [Net.WebRequest]::CreateHttp($testUri)",
          "   $request.Proxy = if ($testUri -ne $proxyUri) { [Net.WebRequest]::DefaultWebProxy } else { $null }",
          "   $request.UseDefaultCredentials = ($testUri -ne $proxyUri)",
          "   $request.UserAgent = $UserAgent",
          "   $request.Method = \"GET\"",
          "   $request.Timeout = 10 * 1000",
          "   $statusCode = 0",
          "   $statusMessage = ''",
          "   $response = $null",
          "   ",
          "   $address = Get-IPAddress -Url $testUri -Verbose:$false",
          "   $resolved = (@($address)).Length -ge 1",
          "   if ($resolved) {",
          "       try{",
          "           $response = $request.GetResponse()",
          "           $httpResponse = $response -as [Net.HttpWebResponse]",
          "           $statusCode = $httpResponse.StatusCode",
          "           $actualStatusCode = [int]$statusCode",
          "       }catch {",
          "           $actualStatusCode = [int]$statusCode",
          "       }",
          "   }",
          "",
          "   $Connectivity = [pscustomobject]@{",
          "       TestUrl = $testUri;",
          "       ActualStatusCode = [int]$actualStatusCode;",
          "       Resolved = $resolved;",
          "       IpAddresses = [string[]]$address;",
          "   }",
          "   return $Connectivity",
          "}",
          "",
          "function Get-WindowsUpdateConnectivity {",
          "   <#",
          "      .SYNOPSIS",
          "         Gets Connectivity information for Windows Update.",
          "      .DESCRIPTION",
          "         Returns Windows update endpoints reachability state",
          "      .EXAMPLE",
          "         Get-WindowsUpdateConnectivity",
          "   #>",
          "   # Check if the PSWindowsUpdate module is installed",
          "   if (Get-Module -ListAvailable -Name PSWindowsUpdate) {",
          "",
          "   # Import the PSWindowsUpdate module",
          "    Import-Module PSWindowsUpdate",
          "    try {",
          "        # Attempt to fetch updates",
          "        $updates = Get-WindowsUpdate  -ErrorAction Stop",
          "        # If updates are successfully fetched, Windows Update is reachable",
          "        $WindowsUpdateEnpointsState = \"Windows Update is reachable.\"",
          "    } catch {",
          "        # If an error occurs, Windows Update is not reachable",
          "        $WindowsUpdateEnpointsState = \"Windows Update is not reachable. Error: $($_.Exception.Message)\"",
          "    }",
          "",
          "   } else {",
          "",
          "   $WuaEndpointsUrls = New-Object System.Collections.Generic.List[System.Collections.Hashtable]",
          "",
          "   # Main endpoints from https://docs.microsoft.com/en-us/windows/privacy/manage-windows-endpoints#windows-update",
          "   # Updating endpoint URL's based on communication from https://tt.amazon.com/D123458046/communication",
          "   $WuaEndpointsUrls.Add(@{ TestUrl = 'http://catalog.update.microsoft.com'})",
          "   $WuaEndpointsUrls.Add(@{ TestUrl = 'https://catalog.update.microsoft.com'})",
          "",
          "   $WindowsUpdateEnpointsState = \"Windows Update is reachable.\"",
          "   $QueryWindowsUpdateEndpoints = New-Object System.Collections.Generic.List[pscustomobject]",
          "    ",
          "   $WuaEndpointsUrls | ForEach-Object {",
          "      $Connectivity = Get-HttpConnectivity @_",
          "      $result = $Connectivity | Where-Object {$_.ActualStatusCode -ne 200 -or -not $_.Resolved}",
          "      $QueryWindowsUpdateEndpoints.Add($result)",
          "   }",
          "   if ($QueryWindowsUpdateEndpoints -ne $null){",
          "      $WindowsUpdateEnpointsState = \"Windows Update is not reachable.\"",
          "   }",
          "   ",
          "   }",
          "",
          "   return $WindowsUpdateEnpointsState",
          "}",
          "",
          "function Get-AdBindingStatus {",
          "   <#",
          "      .SYNOPSIS",
          "         Validate the AD binding status",
          "      .DESCRIPTION",
          "         This function test and returns the computer secure channel status",
          "      .EXAMPLE",
          "         Get-AdBindingStatus",
          "   #>",
          "   try {",
          "       $TrustCheck = Test-ComputerSecureChannel",
          "       $InstaceAccess = \"All ok instance is part of an AD domain\"",
          "",
          "      if ($TrustCheck -eq $false){",
          "         $InstaceAccess = \"Instance is Not joined in the AD domain\"",
          "      }",
          "      return $InstaceAccess",
          "   }",
          "   catch [System.SystemException] {",
          "      return \"The Secure channel could not be tested, the command has failed!\"",
          "   }",
          "",
          "}",
          "",
          "function Get-ProxySettings {",
          "   <#",
          "      .SYNOPSIS",
          "         Validate the Proxy Settings of Windows Instance",
          "      .DESCRIPTION",
          "         This function test and returns the proxy configuration state of the instance.",
          "      .EXAMPLE",
          "         Get-ProxySettings",
          "   #>",
          "",
          "   <#",
          "     .Section: Winhttp Proxy",
          "   #>",
          "",
          "   $proxy_ip = netsh winhttp show proxy | Select-String -Pattern '([a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,7}|([0-9]{1,3}\\.){3}[0-9]{1,3}' -AllMatches | ForEach-Object {$_.Matches.Value}",
          "   if ($proxy_ip) {$winhttp_proxy_status=1} else {$winhttp_proxy_status=0}",
          "",
          "   <#",
          "     .Section: IE_Proxy Setting",
          "   #>",
          "",
          "   $ie_proxy_setting = (Get-ItemProperty -Path 'HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings').ProxyEnable",
          "",
          "",
          "   if (($winhttp_proxy_status -eq 1 ) -or ($ie_proxy_setting -eq 1))",
          "   {",
          "       $ProxyStatus = \"[Warning] Proxy is Enabled on Instance. Please check Winhttp Proxy and IE Proxy Settings.\"",
          "",
          "   }",
          "   else",
          "   {",
          "       $ProxyStatus = \"WinHTTP Proxy and Internet Explorer Proxy is disabled.\"",
          "   }",
          "",
          "   return $ProxyStatus",
          "}",
          "",
          "function Test-WMIRepository {",
          "   <#",
          "   .SYNOPSIS",
          "       Gets Status of WMIRepository.",
          "   .DESCRIPTION",
          "       Returns Whether Repository is Corrupted or Not.",
          "   .EXAMPLE",
          "       Test-WMIRepository",
          "   #> ",
          "   ",
          "   # Execute the command to verify the WMI repository",
          "   $WMIRepositoryStatus = & winmgmt /verifyrepository",
          "",
          "   # Check the output for consistency status",
          "   if ($WMIRepositoryStatus -like \"*consistent*\") {",
          "       $WMIHealthStatus = \"WMI repository is consistent. Good to proceed ahead!\"",
          "   } else {",
          "       $WMIHealthStatus = \"[Warning] WMI repository is INCONSISTENT. Please troubleshoot WMI repository corruption issues.\"",
          "   }",
          "",
          "   # Return the health status",
          "   return $WMIHealthStatus",
          "}",
          "",
          "function Test-TLSVersionEnabled {",
          "    <#",
          "    .SYNOPSIS",
          "        Gets Status of TLS Version.",
          "    .DESCRIPTION",
          "        Returns Whether TLS Version 1.2 is Enabled or Not.",
          "    .EXAMPLE",
          "        Test-TLSVersionEnabled",
          "    #> ",
          "",
          "    $TLSClientRegPath = 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.2\\Client'",
          "    $TLSServerRegPath = 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.2\\Server'",
          "    $TLSRegPath = 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\TLS 1.2'",
          "",
          "    try {",
          "        # Check the status for the client",
          "        $clientEnabled = $false",
          "        if (Test-Path -Path $TLSClientRegPath) {",
          "            $clientDisabledByDefault = (Get-ItemProperty -Path $TLSClientRegPath -Name 'DisabledByDefault' -ErrorAction Stop).DisabledByDefault",
          "            $clientEnabled = ($clientDisabledByDefault -eq 0)",
          "        }",
          "",
          "        # Check the status for the server",
          "        $serverEnabled = $false",
          "        if (Test-Path -Path $TLSServerRegPath) {",
          "            $serverDisabledByDefault = (Get-ItemProperty -Path $TLSServerRegPath -Name 'DisabledByDefault' -ErrorAction Stop).DisabledByDefault",
          "            $serverEnabled = ($serverDisabledByDefault -eq 0)",
          "        }",
          "",
          "        # Check if the TLS 1.2 path exists",
          "        $TLSRegPathExists = Test-Path -Path $TLSRegPath",
          "        $TLSEnabledByDefault = $true",
          "        if ($TLSRegPathExists) {",
          "            $TLSEnabledByDefault = $false",
          "        }",
          "",
          "        # Determine overall TLS 1.2 status",
          "        if ($clientEnabled -or $serverEnabled) {",
          "            $TLSVersionStatus = \"TLS 1.2 Enabled by Registry Keys\"",
          "        } elseif ($TLSEnabledByDefault) {",
          "            $TLSVersionStatus = \"TLS 1.2 Enabled by Default\"",
          "        } else {",
          "            $TLSVersionStatus = \"TLS 1.2 Disabled by Registry Keys\"",
          "        }",
          "    } catch {",
          "        $TLSVersionStatus = \"Error determining TLS 1.2 status: $_\"",
          "    }",
          "",
          "    return $TLSVersionStatus",
          "}",
          "",
          "function Test-SupportedOS {",
          "   <#",
          "   .SYNOPSIS",
          "       Gets Status of OS.",
          "   .DESCRIPTION",
          "       Returns Whether OS is Supported or Not.",
          "   .EXAMPLE",
          "       Test-SupportedOS",
          "   #>",
          "   ",
          "   # Get the OS name",
          "   $OSName = (Get-WmiObject -Class Win32_OperatingSystem).Caption",
          "   ",
          "   # Define unsupported OS patterns",
          "   $UnsupportedOSPatterns = @(\"*2000*\", \"*2003*\", \"*2008*\")",
          "   ",
          "   # Check if the OS name matches any of the unsupported patterns",
          "   $isUnsupported = $false",
          "   foreach ($pattern in $UnsupportedOSPatterns) {",
          "       if ($OSName -like $pattern) {",
          "           $isUnsupported = $true",
          "           break",
          "       }",
          "   }",
          "   ",
          "   # Determine the status based on whether the OS is unsupported",
          "   if ($isUnsupported) {",
          "       $UnsupportedStatus = \"Unsupported\"",
          "   } else {",
          "       $UnsupportedStatus = \"Supported\"",
          "   }",
          "   ",
          "   # Return the status",
          "   return $UnsupportedStatus",
          "}",
          "",
          "function Check-AutoUpdate {",
          "   <#",
          "   .SYNOPSIS",
          "       Gets Auto Update Status.",
          "   .DESCRIPTION",
          "       Returns the registry value for Auto Update.",
          "   .EXAMPLE",
          "       Check-AutoUpdate",
          "   #>",
          "",
          "   # Define the registry key path and value name",
          "   $AURegKey = 'HKLM:\\Software\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU'",
          "   $AURegKeyName = 'NoAutoUpdate'",
          "",
          "   try {",
          "       # Get the registry value",
          "       $regValue = Get-ItemProperty -Path $AURegKey -Name $AURegKeyName -ErrorAction Stop",
          "",
          "       # Determine the status based on the registry value",
          "       if ($regValue.$AURegKeyName -eq 1) {",
          "           $AutoUpdateStatus = \"Automatic Updates Disabled\"",
          "       }",
          "       elseif ($regValue.$AURegKeyName -eq 0) {",
          "           $AutoUpdateStatus = \"Automatic Updates Enabled\"",
          "       }",
          "       else {",
          "           $AutoUpdateStatus = \"Unknown Auto Update status\"",
          "       }",
          "   } catch {",
          "       # Handle errors (e.g., key or value not found)",
          "       $AutoUpdateStatus = \"Failed to retrieve the Auto Update status. Error: $_\"",
          "   }",
          "",
          "   # Return the auto update status",
          "   return $AutoUpdateStatus",
          "}",
          "",
          "function Get-WinhttpAutoProxy {",
          "   <#",
          "   .SYNOPSIS",
          "       Gets Status for WinHttpAutoProxy.",
          "   .DESCRIPTION",
          "       Returns WinHttpAuto Proxy state.",
          "   .EXAMPLE",
          "       Get-WinhttpAutoProxy",
          "   #>",
          "",
          "   # Define the registry key and value",
          "   $WinhttpRegKey = 'HKLM:\\System\\CurrentControlSet\\Services\\WinHttpAutoProxySvc'",
          "   $WinhttpRegKeyName = 'Start'",
          "",
          "   try {",
          "       # Get the registry value",
          "       $WinhttpstateValue = (Get-ItemProperty -Path $WinhttpRegKey -Name $WinhttpRegKeyName -ErrorAction Stop).$WinhttpRegKeyName",
          "",
          "       # Get the service status",
          "       $Status = (Get-Service -Name \"WinHttpAutoProxySvc\" -ErrorAction Stop).Status",
          "",
          "       # Determine the state based on the registry value and service status",
          "       if ($WinhttpstateValue -ne 4 -and $Status -eq \"Running\") {",
          "           $Winhttpstate = \"WinHttpAutoProxyService Running. Please verify the Registry Settings.\"",
          "       } elseif ($WinhttpstateValue -eq 4 -and $Status -eq \"Running\") {",
          "           $Winhttpstate = \"WinHttpAutoProxyService Running. Registry Settings are Okay.\"",
          "       } elseif ($WinhttpstateValue -eq 4 -and $Status -eq \"Stopped\") {",
          "           $Winhttpstate = \"WinHttpAutoProxyService Stopped. Registry Settings are Okay.\"",
          "       } else {",
          "           $Winhttpstate = \"WinHttpAutoProxyService Stopped. Please Verify Registry Settings.\"",
          "       }",
          "   } catch {",
          "       # Handle errors (e.g., key or service not found)",
          "       $Winhttpstate = \"Error determining WinHttpAutoProxyService status: $_\"",
          "   }",
          "",
          "   # Return the state",
          "   return $Winhttpstate",
          "}",
          "",
          "function Test-ESUStatus {",
          "   <#",
          "   .SYNOPSIS",
          "       Gets Status of ESU (Extended Security Updates).",
          "   .DESCRIPTION",
          "       Returns Whether ESU Registry Exists or Not.",
          "   .EXAMPLE",
          "       Test-ESUStatus",
          "   #>",
          "   ",
          "   # Define the ESU registry key path",
          "   $esuKeyPath = \"HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\ESU\"",
          "   ",
          "   # Get the OS name",
          "   $OSName = (Get-WmiObject -Class Win32_OperatingSystem).Caption",
          "   ",
          "   # Check if the OS is Windows Server 2012",
          "   if ($OSName -like \"*2012*\") {",
          "       # Check ESU registry keys",
          "       $regKeys = Get-ItemProperty -Path $esuKeyPath -ErrorAction SilentlyContinue",
          "",
          "       if ($regKeys -eq $null) {",
          "           $esustatus = \"ESU is not enabled. Registry Keys are Missing\"",
          "       } else {",
          "           $esustatus = \"ESU Registry Keys Found\"",
          "       }",
          "   } else {",
          "       $esustatus = \"This is not applicable for this OS.\"",
          "   }",
          "",
          "   # Return the ESU status",
          "   return $esustatus",
          "}",
          "",
          "function Get-S3UrlsForRegion {",
          "    param([string]$region)",
          "    ",
          "    $uniqueKey = Get-RegionMapping -regionCode $region",
          "    $domain = \"amazonaws.com\"",
          "    ",
          "    # Special domain handling for China regions",
          "    if ($region -like \"*cn-*\") {",
          "        $domain = \"amazonaws.com.cn\"",
          "    }",
          "    ",
          "    $urls = @()",
          "    $urls += \"https://s3.$region.$domain/aws-ssm-$region/patchbaselineoperations/Amazon.PatchBaselineOperations-1.65.zip\"",
          "    ",
          "    if ($uniqueKey -ne \"unknown\") {",
          "        $urls += \"https://s3.$region.$domain/aws-patch-manager-$region-$uniqueKey/patchbaselineoperations/Amazon.PatchBaselineOperations-1.65.zip\"",
          "        $urls += \"https://s3.dualstack.$region.$domain/aws-patch-manager-$region-$uniqueKey/patchbaselineoperations/Amazon.PatchBaselineOperations-1.65.zip\"",
          "    }",
          "    ",
          "    return $urls",
          "}",
          "",
          "function Test-S3EndpointConnectivity {",
          "   <#",
          "   .SYNOPSIS",
          "       Gets Connectivity Status for S3 Endpoint.",
          "   .DESCRIPTION",
          "       Returns S3 Endpoint Connectivity status by testing connection to the S3 endpoint in the current AWS region.",
          "   .EXAMPLE",
          "       Test-S3EndpointConnectivity",
          "   #>",
          "   $s3Urls = Get-S3UrlsForRegion -region $awsSsmRegionName",
          "   $timeoutSeconds = 10",
          "   ",
          "   foreach ($s3Url in $s3Urls) {",
          "       try {",
          "           $response = Invoke-WebRequest -Uri $s3Url -Method Head -UseBasicParsing -TimeoutSec $timeoutSeconds -ErrorAction Stop",
          "           if ($response.StatusCode -eq 200) {",
          "               return \"Connection successful to $s3Url\"",
          "           }",
          "       } catch {",
          "           continue",
          "       }",
          "   }",
          "   ",
          "   return \"Error determining S3 Endpoint Connectivity: All connection attempts failed\"",
          "}",
          "",
