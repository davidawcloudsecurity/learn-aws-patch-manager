          "",
          "function Get-SsmCommandUrl {",
          "    # Build the URL if all required variables are present",
          "    if ($ssmCommandId -and $awsSsmRegionName -and $awsSsmInstanceId) {",
          "        $CommandIdUrl = \"https://$awsSsmRegionName.console.aws.amazon.com/systems-manager/run-command/$ssmCommandId/$awsSsmInstanceId\"",
          "    } else {",
          "        $CommandIdUrl = \"Unable to determine the command ID URL.\"",
          "    }",
