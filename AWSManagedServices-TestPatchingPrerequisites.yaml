          "        \"eu-south-1\" = \"c52f3f594\"      # MXP",
          "        \"eu-south-2\" = \"a4cf248b1\"      # ZAZ",
          "        \"eu-central-2\" = \"184ce43c8\"    # ZRH",
          "        \"ap-south-2\" = \"32f4b4128\"      # HYD",
