          "        \"il-central-1\") echo \"e221cb57b\" ;;  # TLV",
          "        \"ca-west-1\") echo \"9e3a4b2f9\" ;;     # YYC",
          "        \"ap-southeast-5\") echo \"dcb42f3e3\" ;; # KUL",
          "        \"us-northeast-1\") echo \"67205673d\" ;; # MDW",
          "        \"ap-southeast-7\") echo \"c707c017a\" ;; # BKK",
          "        \"mx-central-1\") echo \"396b275ad\" ;;  # QRO",
          "        \"ap-east-2\") echo \"5a64b2916\" ;;     # TPE",
          "        \"ap-southeast-6\") echo \"df0d3a7f2\" ;; # AKL",
          "        *) echo \"unknown\" ;;",
          "    esac",
          "}",
          "",
          "# Function to get all S3 URLs for a region",
          "get_s3_urls() {",
          "    local region=\"$1\"",
          "    local unique_key=$(get_region_mapping \"$region\")",
          "    local domain=\"amazonaws.com\"",
          "    ",
          "    # Special domain handling for China regions",
          "    if [[ $region == *\"cn-\"* ]]; then",
          "        domain=\"amazonaws.com.cn\"",
          "    fi",
          "    ",
          "    # Generate all three URL patterns for Linux",
          "    echo \"https://s3.$region.$domain/aws-ssm-$region/patchbaselineoperations/linux/payloads/patch-baseline-operations-1.208.tar.gz\"",
          "    if [[ \"$unique_key\" != \"unknown\" ]]; then",
          "        echo \"https://s3.$region.$domain/aws-patch-manager-$region-$unique_key/patchbaselineoperations/linux/payloads/patch-baseline-operations-1.208.tar.gz\"",
          "        echo \"https://s3.dualstack.$region.$domain/aws-patch-manager-$region-$unique_key/patchbaselineoperations/linux/payloads/patch-baseline-operations-1.208.tar.gz\"",
          "    fi",
          "}",
          "",
          "# Test S3 connectivity with multiple URLs",
          "test_s3_connectivity() {",
          "    local timeout=\"$1\"",
          "    local has_curl=\"$2\"",
          "    local has_wget=\"$3\"",
          "    ",
          "    # Get all URLs for the region",
          "    local urls=($(get_s3_urls \"$AWS_SSM_REGION_NAME\"))",
          "    ",
          "    for url in \"${urls[@]}\"; do",
          "        if [[ $has_curl -eq 0 ]]; then",
          "            local status=$(curl -s -o /dev/null -m $timeout -w \"%{http_code}\" \"$url\" 2>&1) || true",
          "            if [ \"$status\" -eq 200 ]; then",
          "                echo \"Connection Successful to $url\"",
          "                return 0",
          "            fi",
          "        elif [[ $has_wget -eq 0 ]]; then",
          "            local result=$(wget --tries=1 --timeout=$timeout --spider --server-response \"$url\" 2>&1) || true",
          "            if echo \"$result\" | grep -wq \"200 OK\"; then",
          "                echo \"Connection Successful to $url\"",
          "                return 0",
          "            fi",
          "        fi",
          "    done",
          "    ",
          "    echo \"Connection Failed to all S3 URLs\"",
          "    return 1",
          "}",
          "",
          "# Function to handle unsupported or unrecognized OS version",
          "handle_os_version() {",
          "    OS_VERSION=$1",
          "    if [[ \"$OS_VERSION\" == \"UNKNOWN\" ]]; then",
          "        OS_STATUS=\"Failed to recognize operating system\"",
          "    elif [[ \"$OS_VERSION\" == UNSUPPORTED_OS* ]]; then",
          "        OS_STATUS=\"$OS_VERSION Exiting.\"",
          "    else",
          "        OS_STATUS=\"OK\"",
          "        echo \"$OS_VERSION\"",
          "    fi",
          "}",
          "",
          "# MANAGED INSTANCE SUPPORT",
          "# Managed instances (hybrid registration) are on-premises or edge servers registered with SSM.",
          "# They use instance IDs starting with 'mi-' instead of 'i-' and require different credential/connectivity checks.",
          "# For managed instances: Use ssm-cli diagnostics instead of EC2 metadata service.",
          "# For EC2 instances: Use traditional metadata service for credential validation.",
          "",
          "# Verifies if the instance is able to get credentials from the Metadata Service and verify the s3 endpoint connection",
          "assert_aws_credentials_s3_connectivity() {",
          "    echo \"Asserting the AWS Credentials.\"",
          "    ",
          "    if [[ -n \"$AWS_SSM_INSTANCE_ID\" && \"$AWS_SSM_INSTANCE_ID\" =~ ^mi- ]]; then",
          "        instance_registration=\"Hybrid Instance\"",
          "    else",
          "        instance_registration=\"EC2 Instance\"",
          "    fi",
          "    ",
          "    echo \"Detected $instance_registration\"",
          "    ",
          "    # Common variables",
          "    HAS_CURL=0",
          "    HAS_WGET=0",
          "    METADATAQUERY=0",
          "    TOKEN_HEADER=\":\"",
          "    CREDSACCESSIBLE=\"Failed\"",
          "    METADATAACCESS=\"Unreachable\"",
          "    # S3 URLs will be determined dynamically in test_s3_connectivity",
          "    TIMEOUT=10",
          "    hash \"curl\" 2>/dev/null || HAS_CURL=$?",
          "    hash \"wget\" 2>/dev/null || HAS_WGET=$?",
          "",
          "    if [[ \"$instance_registration\" == \"Hybrid Instance\" ]]; then",
          "        # Validate ssm-cli availability and version",
          "        if ! command -v ssm-cli &> /dev/null; then",
          "            echo \"Error: ssm-cli not found. SSM Agent 3.1.501.0+ required.\"",
          "            CREDSACCESSIBLE=\"Hybrid Instance - ssm-cli not available\"",
          "            S3EndpointConnectivity=\"Hybrid Instance - ssm-cli not available\"",
          "            METADATAACCESS=\"Hybrid Instance - Skipped\"",
          "        else",
          "            # Check SSM Agent version",
          "            ssm_version=$(amazon-ssm-agent --version 2>/dev/null | head -1 | awk '{print $NF}')",
          "            if [[ -n \"$ssm_version\" ]] && [[ \"$(printf '%s\\n%s\\n' \"$ssm_version\" \"3.1.501.0\" | sort -V | head -n1)\" == \"$ssm_version\" ]] && [[ \"$ssm_version\" != \"3.1.501.0\" ]]; then",
          "                echo \"Error: SSM Agent version $ssm_version is too old. Version 3.1.501.0+ required for ssm-cli.\"",
          "                CREDSACCESSIBLE=\"Hybrid Instance - SSM Agent version too old\"",
          "                S3EndpointConnectivity=\"Hybrid Instance - SSM Agent version too old\"",
          "                METADATAACCESS=\"Hybrid Instance - Skipped\"",
          "            else",
          "                # SSM Hybrid Instance - get diagnostics once and parse",
          "                ssm_diagnostics=$(timeout 600 ssm-cli get-diagnostics --output table)",
          "                if [[ -z \"$ssm_diagnostics\" ]]; then",
          "                    echo \"Error: ssm-cli diagnostics returned empty output\"",
          "                    CREDSACCESSIBLE=\"Hybrid Instance - ssm-cli failed\"",
          "                    S3EndpointConnectivity=\"Hybrid Instance - ssm-cli failed\"",
          "                    METADATAACCESS=\"Hybrid Instance - Skipped\"",
          "                else",
          "                    S3EndpointConnectivity=$(echo \"$ssm_diagnostics\" | grep \"Connectivity to s3 endpoint\" | awk -F'│' '{print $3}' | xargs)",
          "                    CREDSACCESSIBLE=\"Hybrid Instance - using IAM role\"",
          "                    METADATAACCESS=\"Hybrid Instance - Skipped\"",
          "                fi",
          "            fi",
          "        fi",
          "    else",
          "        # EC2 Instance - use metadata service",
          "        if [[ $HAS_CURL -eq 0 ]]; then",
          "            TOKEN=$(curl -X PUT \"${METADATAURL}/api/token\" -m $TIMEOUT -f -s -H \"X-aws-ec2-metadata-token-ttl-seconds: 21600\")",
          "            if [[ -n \"$TOKEN\" ]]; then",
          "                METADATAACCESS=\"Reachable\"",
          "                TOKEN_HEADER=\"X-aws-ec2-metadata-token: $TOKEN\"",
          "                IAM_ROLE=$(curl -m $TIMEOUT -H \"$TOKEN_HEADER\" -f -s ${METADATAURL}/meta-data/iam/security-credentials)",
          "                CREDENTIALS=$(curl -m $TIMEOUT -H \"$TOKEN_HEADER\" -f -s ${METADATAURL}/meta-data/iam/security-credentials/\"$IAM_ROLE\")",
          "                CREDSACCESSIBLE=$(awk '/\"Code\" : / {gsub(/[\\\"\\,]/,\"\");print $3}' <<< \"$CREDENTIALS\")",
          "                S3EndpointConnectivity=$(test_s3_connectivity \"$TIMEOUT\" \"$HAS_CURL\" \"$HAS_WGET\")",
          "            fi",
          "        elif [[ $HAS_WGET -eq 0 ]]; then",
          "            TOKEN=\"$(wget -qO- -T $TIMEOUT --method PUT --header \"X-aws-ec2-metadata-token-ttl-seconds: 21600\" ${METADATAURL}/api/token)\"",
          "            if [[ -n \"$TOKEN\" ]]; then",
          "                METADATAACCESS=\"Reachable\"",
          "                TOKEN_HEADER=\"X-aws-ec2-metadata-token: $TOKEN\"",
          "                IAM_ROLE=\"$(wget -qO- -T $TIMEOUT --header \"$TOKEN_HEADER\" ${METADATAURL}/meta-data/iam/security-credentials)\"",
          "                CREDENTIALS=\"$(wget -qO- -T $TIMEOUT --header \"$TOKEN_HEADER\" ${METADATAURL}/meta-data/iam/security-credentials/\"$IAM_ROLE\")\"",
          "                CREDSACCESSIBLE=$(awk '/\"Code\" : / {gsub(/[\\\"\\,]/,\"\");print $3}' <<< \"$CREDENTIALS\")",
          "                S3EndpointConnectivity=$(test_s3_connectivity \"$TIMEOUT\" \"$HAS_CURL\" \"$HAS_WGET\")",
          "            fi",
          "        fi",
          "    fi",
          "    echo \"Asserting the AWS Credentials Complete.\"",
          "}",
          "",
          "# Get the command id of the execution of the ssm document",
          "get_ssm_command_url() {",
          "    if [ -n \"$SSM_COMMAND_ID\" ] && [ -n \"$AWS_SSM_REGION_NAME\" ] && [ -n \"$AWS_SSM_INSTANCE_ID\" ]; then",
          "        COMMAND_ID_URL=\"https://${AWS_SSM_REGION_NAME}.console.aws.amazon.com/systems-manager/run-command/${SSM_COMMAND_ID}/${AWS_SSM_INSTANCE_ID}\"",
          "    else",
          "        COMMAND_ID_URL=\"Unable to determine the command ID URL.\"",
          "    fi",
          "}",
          "",
          "# Verifies root volume, /var/log and /var/cache (if resides in another filesystem other than root) available space",
          "verify_space_available() {",
          "    echo \"Asserting the disk space.\"",
          "    ROOTDISKFREE=\"$(df -P -BM / | awk '$6 ~ \"/\" {gsub(/[%M]+/,\"\");print $4}')\"",
          "    VARCACHEDISKFREE=\"$(df -P -BM /var/cache | awk '$6 ~ \"/\" {gsub(/[%M]+/,\"\");print $4}')\"",
          "    VARLOGDISKFREE=\"$(df -P -BM /var/log | awk '$6 ~ \"/\" {gsub(/[%M]+/,\"\");print $4}')\"",
          "    BOOTDISKFREE=\"$(df -P -BM /boot | awk '$6 ~ \"/\" {gsub(/[%M]+/,\"\");print $4}')\"",
          "    ROOTRECCOMEDEDSPACE=2500",
          "    VARLOGRECCOMENDEDSPACE=1500",
          "    VARCACHERECCOMENDEDSPACE=2000",
          "    BOOTRECCOMENDEDSPACE=50",
          "    VOLUMESPACECRITERIA=\"Meet\"",
          "",
          "    if [[ $ROOTRECCOMEDEDSPACE -gt $ROOTDISKFREE ]]; then",
          "        VOLUMESPACECRITERIA=\"Not Meet\"",
          "    elif [[ $VARLOGRECCOMENDEDSPACE -gt $VARLOGDISKFREE ]]; then",
          "        VOLUMESPACECRITERIA=\"Not Meet\"",
          "    elif [[ $VARCACHERECCOMENDEDSPACE -gt $VARCACHEDISKFREE ]]; then",
          "        VOLUMESPACECRITERIA=\"Not Meet\"",
          "    elif [[ $BOOTRECCOMENDEDSPACE -gt $BOOTDISKFREE ]]; then",
          "        VOLUMESPACECRITERIA=\"Not Meet\"    ",
          "    fi",
          "    echo \"Asserting the disk space complete.\"",
          "}",
          "",
          "# Verifies the integrity of xfs and/or ext4 file systems (in case the instance has these filesystems type)",
          "verify_xfs_ext4_filesystems_integrity() {",
          "    echo \"Asserting xfs/ext4 filesystems integrity\"",
          "    ",
          "    FILESYSTEM_CORRUPTION_CHECK_XFS_EXT4=\"N/A\"",
          "    if [[ $(grep \"xfs\\|ext4\" /etc/fstab) ]]; then ",
          "        echo -e \"Filesystems with xfs and/or ext4 types detected:\\n$(grep \"xfs\\|ext4\" /etc/fstab)\"",
          "        echo \"Checking logs for any filesystem corruption ...\"",
          "        if [[ $(grep 'EXT4-fs error\\|metadata I/O error in .*xfs' /var/log/messages) ]] || [[ $(dmesg -T | grep -i 'EXT4-fs.*error\\|XFS.*error\\|EXT4-fs error' ) ]]; then ",
          "            echo \"Errors related to filesystem corruption have been detected as follows:\"",
          "            echo -e \"/var/log/messages Logs:\\n$(grep 'EXT4-fs error\\|metadata I/O error in.*xfs' /var/log/messages)\\ndmesg Logs\\n$(dmesg -T | grep 'EXT4-fs.*error\\|XFS.*error')\"",
          "            FILESYSTEM_CORRUPTION_CHECK_XFS_EXT4=\"Errors Detected\"",
          "        else",
          "            FILESYSTEM_CORRUPTION_CHECK_XFS_EXT4=\"No Errors Detected\"",
          "        fi",
          "    fi",
          "    ",
          "    echo \"FILESYSTEM_CORRUPTION_CHECK_XFS_EXT4 = $FILESYSTEM_CORRUPTION_CHECK_XFS_EXT4\"",
          "    echo \"Asserting xfs/ext4 filesystem integrity completed.\"",
          "}",
          "",
          "# Detect Python versions within a specified range",
          "check_python_versions() {",
          "    echo \"Validating Python versions within the range 2.6 to 3.10.\"",
          "    FOUND_PYTHON_VERSION=\"\"",
          "    PYTHON_PATH_USED=\"\"",
          "    PYTHON_PATHS=(\"/usr/bin/python\" \"/usr/bin/python2\" \"/usr/bin/python3\" \"/usr/libexec/platform-python\")",
          "",
          "    for PYTHON_PATH in \"${PYTHON_PATHS[@]}\"",
          "    do",
          "        if [ -x \"$PYTHON_PATH\" ]; then",
          "            PYTHON_VERSION=$(\"$PYTHON_PATH\" --version 2>&1 | awk '{print $2}')",
          "            PYTHON_MAJOR_VERSION=$(echo \"$PYTHON_VERSION\" | cut -d'.' -f1)",
          "            PYTHON_MINOR_VERSION=$(echo \"$PYTHON_VERSION\" | cut -d'.' -f2)",
          "",
          "            if [ \"$PYTHON_MAJOR_VERSION\" -eq 2 ] && [ \"$PYTHON_MINOR_VERSION\" -ge 6 ] || \\",
          "               [ \"$PYTHON_MAJOR_VERSION\" -eq 3 ] && [ \"$PYTHON_MINOR_VERSION\" -le 10 ]; then",
          "                if [[ ! \"$FOUND_PYTHON_VERSION\" =~ \"$PYTHON_VERSION\" ]]; then",
          "                    FOUND_PYTHON_VERSION+=\"Python ${PYTHON_VERSION} \"",
          "                    PYTHON_PATH_USED=\"$PYTHON_PATH\"",
          "                fi",
          "            fi",
          "        fi",
          "    done",
          "",
          "    if [ -n \"$FOUND_PYTHON_VERSION\" ]; then",
          "        echo -e \"$FOUND_PYTHON_VERSION\" | sort -u",
          "    else",
          "        echo \"No Python versions found within the range 2.6 to 3.10.\"",
          "    fi",
          "",
          "    echo \"Validation of Python versions complete.\"",
          "}",
          "",
          "# Verify if a valid Red Hat subscription is attached",
          "verify_red_hat_subscription_status() {",
          "    echo \"Asserting the Red Hat subscription.\"",
          "    UPDATESERVICECONFIG=\"RHEL subscription manager is healthy.\"",
          "    SUBSCRIPTIONMANAGERCORRUPTED=0",
          "    PRODUCTNAME=\"Red Hat Enterprise Linux Server\"",
          "    if subscription-manager status | grep -q \"Content Access Mode is set to Simple Content Access\" && subscription-manager list --available --matches=\"Red Hat Enterprise Linux Server\" > /dev/null; then",
          "        return",
          "    fi",
          "    SUBSCRIPTIONSTATUSOUTPUT=$(LC_ALL=C subscription-manager list --consumed --matches=\"$PRODUCTNAME\") || SUBSCRIPTIONMANAGERCORRUPTED=$?",
          "    SUBSCRIPTIONSAVAILBLE=$(LC_ALL=C subscription-manager list --available --matches=\"$PRODUCTNAME\") || SUBSCRIPTIONMANAGERCORRUPTED=$?",
          "    if [[ $SUBSCRIPTIONSTATUSOUTPUT =~ \"No consumed subscription pools were found\" || $SUBSCRIPTIONSAVAILBLE =~ (\"No available subscription pools to list\"|\"This system is not yet registered\") || $SUBSCRIPTIONMANAGERCORRUPTED -ne 0 ]]; then",
          "        UPDATESERVICECONFIG=\"Not Healthy, there is no Red Hat subscription Attached/Installed, or subscription manager is corrupted\"",
          "        echo $UPDATESERVICECONFIG",
          "    else",
          "        DATENOW=$(date +\"%Y%m%d\")",
          "        EXPIRESDATE=$(date -d '2000-01-01' +\"%Y%m%d\")",
          "        EXPIRESON=$(awk '{if  ($0 ~ /^(Expires|Ends)/) {print $2; exit} }' <<< \"$SUBSCRIPTIONSTATUSOUTPUT\")",
          "        [[ -n \"$EXPIRESON\" ]] && EXPIRESDATE=$(date -d \"$EXPIRESON\" +\"%Y%m%d\")",
          "        [[ $DATENOW -ge $EXPIRESDATE ]] && UPDATESERVICECONFIG=\"Not Healthy, Red Hat Subscription has expired or not Active\"",
          "        echo $UPDATESERVICECONFIG",
          "    fi",
          "    echo \"Asserting Red Hat subscription complete.\"",
          "}",
          "",
          "# Verify AlmaLinux subscription status",
          "verify_alma_subscription_status() {",
          "    echo \"Asserting the AlmaLinux subscription status.\"",
          "    SUBSCRIPTIONSTATUSOUTPUT=$(timeout 600 yum repolist 2>/dev/null | grep -qw \"AlmaLinux\")",
          "    if [[ $? -eq 0 ]]; then",
          "        echo \"AlmaLinux subscription is valid.\"",
          "    else",
          "        UPDATESERVICECONFIG=\"Not Healthy, official AlmaLinux repositories are not enabled.\"",
          "        echo $UPDATESERVICECONFIG",
          "    fi",
          "    echo \"Asserting AlmaLinux subscription complete.\"",
          "}",
          "",
          "# Verify SLES subscription status with YaST",
          "verify_sles_subscription_status() {",
          "    echo \"Asserting the SLES subscription.\"",
          "",
          "    SUBSCRIPTIONSTATUSOUTPUT=$(timeout 600 suseconnect -s 2>/dev/null | grep -Po '\"status\":\"Registered\"') || SUBSCRIPTIONSTATUSOUTPUT=\"Error\"",
          "",
          "    if [[ $SUBSCRIPTIONSTATUSOUTPUT == \"Error\" || -z $SUBSCRIPTIONSTATUSOUTPUT ]]; then",
          "        UPDATESERVICECONFIG=\"Not Healthy, there is no SLES subscription attached/installed.\"",
          "        echo $UPDATESERVICECONFIG",
          "    else",
          "        echo \"SLES subscription manager is healthy\"",
          "    fi",
          "    echo \"Asserting SLES subscription complete.\"",
          "}",
          "",
          "# Verify Oracle Linux subscription status",
          "verify_oracle_linux_subscription_status() {",
          "    echo \"Asserting the Oracle Linux subscription.\"",
          "    SUBSCRIPTIONSTATUSOUTPUT=$(timeout 600 yum repolist 2>/dev/null) || SUBSCRIPTIONSTATUSOUTPUT=\"Error\"",
          "    if [[ $SUBSCRIPTIONSTATUSOUTPUT =~ \"repolist: 0\" || $SUBSCRIPTIONSTATUSOUTPUT == \"Error\" ]]; then",
          "        UPDATESERVICECONFIG=\"Not Healthy, there is no Oracle Linux subscription attached/installed, or yum is corrupted\"",
          "        echo $UPDATESERVICECONFIG",
          "    else",
          "        echo \"Oracle Linux subscription manager is healthy.\"",
          "    fi",
          "    echo \"Asserting Oracle Linux subscription complete.\"",
          "}",
          "",
          "# Verify if a valid Ubuntu subscription is attached",
          "verify_ubuntu_subscription_status() {",
          "    echo \"Asserting the Ubuntu subscription status.\"",
          "    SUBSCRIPTIONSTATUSOUTPUT=$(grep -inr \"ubuntu\" /etc/apt/sources.list* 2>/dev/null) || SUBSCRIPTIONSTATUSOUTPUT=\"Error\"",
          "    if [[ \"$SUBSCRIPTIONSTATUSOUTPUT\" != \"Error\" ]]; then",
          "        echo \"Ubuntu subscription manager is healthy.\"",
          "    else",
          "        UPDATESERVICECONFIG=\"Not Healthy, there is no Ubuntu subscription attached/installed, or Repos are not configured properly\"",
          "        echo $UPDATESERVICECONFIG",
          "    fi",
          "    echo \"Asserting Ubuntu subscription complete.\"",
          "}",
          "",
          "# Validates the license based on the OS version",
          "validate_license() {",
          "    OS_VERSION=$1",
          "    UPDATESERVICECONFIG=\"Healthy\"",
          "    TIMEOUT=10",
          "",
          "        case \"$OS_VERSION\" in",
          "            RHEL_7|RHEL_8|RHEL_9|CENTOS_6|CENTOS_7|CENTOS_9|AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3)",
          "                REPOSMALFORMED=0",
          "                REPOSENABLED=\"$(yum repolist enabled 2>/dev/null | sed -e '0,/^repo id/d' | tr '\\n' ' ')\" || REPOSMALFORMED=$?",
          "                    if [[ $REPOSMALFORMED -eq 0 ]]; then",
          "                        case \"$OS_VERSION\" in",
          "                            RHEL_7|RHEL_8|RHEL_9)",
          "                                # For managed/hybrid instances, skip billing product check and verify subscription directly",
          "                                if [[ -n \"$AWS_SSM_INSTANCE_ID\" && \"$AWS_SSM_INSTANCE_ID\" =~ ^mi- ]]; then",
          "                                    verify_red_hat_subscription_status",
          "                                else",
          "                                    REPOSMANAGED=\"False\"",
          "                                    TOKEN=$(curl -X PUT \"${METADATAURL}/api/token\" -m $TIMEOUT -f -s -H \"X-aws-ec2-metadata-token-ttl-seconds: 21600\")",
          "                                    if [[ -n \"$TOKEN\" ]]; then TOKEN_HEADER=\"X-aws-ec2-metadata-token: $TOKEN\"; fi",
          "                                    BILLING_PRODUCT=$(curl -s -m $TIMEOUT -H \"${TOKEN_HEADER}\" ${METADATAURL}/dynamic/instance-identity/document 2>/dev/null | grep billingProducts)",
          "                                    if [[ $(grep \"bp-\" <<< \"$BILLING_PRODUCT\") && $(rpm -q rh-amazon-rhui-client) ]]; then REPOSMANAGED=\"True\"; UPDATESERVICECONFIG=\"RHEL RHUI configuration is healthy.\"; fi",
          "                                    if [[ \"${REPOSMANAGED}\" == \"False\" ]]; then",
          "                                        verify_red_hat_subscription_status",
          "                                    fi",
          "                                fi",
          "                                ;;",
          "                            CENTOS_6|CENTOS_7|CENTOS_9)",
          "                                CENTOSREPOSBASE=$(awk '($1 ~ \"base\") {print $1}' <<< \"$REPOSENABLED\")",
          "                                CENTOSREPOSUPDATES=$(awk '($1 ~ \"updates\") {print $1}' <<< \"$REPOSENABLED\")",
          "                                CENTOSREPOSSCLO=$(awk '($1 ~ \"centos-sclo\") {print $1}' <<< \"$REPOSENABLED\")",
          "                                CENTOSEXPERIMENTALKERNELS=$(awk '($1 ~ \"centos-kernel\") {print $1}' <<< \"$REPOSENABLED\")",
          "                                if [[ -z $CENTOSREPOSBASE && -z $CENTOSREPOSSCLO && -z $CENTOSREPOSUPDATES ]]; then UPDATESERVICECONFIG=\"Not Healthy, CentOS official repositories are not enabled\"; fi",
          "                                if [[ -n $CENTOSEXPERIMENTALKERNELS ]]; then UPDATESERVICECONFIG=\"Not Healthy, CentOS experimental kernels repository are not enabled\"; fi",
          "                            ;;",
          "                            AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3)",
          "                                AMZNLINUX3REPOS=$(awk '($1 ~ \"amazonlinux\") {print $1}' <<< \"$REPOSENABLED\")",
          "                                AMZNLINUX2REPOS=$(awk '($1 ~ \"amzn2-core\") {print $1}' <<< \"$REPOSENABLED\")",
          "                                AMZNLINUXREPOS=$(awk '($1 ~ \"amzn-main\") {print $1}' <<< \"$REPOSENABLED\")",
          "                                if [[ -z $AMZNLINUXREPOS && -z $AMZNLINUX2REPOS && -z $AMZNLINUX3REPOS ]]; then UPDATESERVICECONFIG=\"Not Healthy, official amazon repositories are not accessible\"; fi",
          "                            ;;",
          "                        esac",
          "                    else",
          "                        UPDATESERVICECONFIG=\"Not Healthy\"",
          "                        REPOSENABLED=\"There was an error while accessing repositories enabled\"",
          "                    fi",
          "                    ;;",
          "            ALMA_8|ALMA_9)",
          "                REPOSMALFORMED=0",
          "                REPOSENABLED=$(timeout 600 dnf repolist enabled 2>/dev/null | sed -e '0,/^repo id/d' | tr '\\n' ' ') || REPOSMALFORMED=$?",
          "                if [[ $REPOSMALFORMED -eq 0 ]]; then",
          "                    verify_alma_subscription_status",
          "                else",
          "                    UPDATESERVICECONFIG=\"Not Healthy\"",
          "                    REPOSENABLED=\"There was an error while accessing repositories enabled\"",
          "                fi",
          "                ;;",
          "            SLES_12|SLES_15)",
          "                REPOSMALFORMED=0",
          "                REPOSENABLED=\"$(timeout 600 zypper lr 2>/dev/null|grep -v Alias| awk '/\\|/ {print $3}' | cut -d'|' -f2)\" || REPOSMALFORMED=$?",
          "                if [[ $REPOSMALFORMED -eq 0 ]]; then",
          "                    verify_sles_subscription_status",
          "                else",
          "                    UPDATESERVICECONFIG=\"Not Healthy, official SUSE repositories are not accessible\"",
          "                    REPOSENABLED=\"There was an error while accessing repositories enabled\"",
          "                fi",
          "                ;;",
          "            ORACLE_LINUX_*)",
          "                REPOSMALFORMED=0",
          "                REPOSENABLED=$(timeout 600 yum repolist enabled 2>/dev/null | sed -e '0,/^repo id/d' | tr '\\n' ' ') || REPOSMALFORMED=$?",
          "                if [[ $REPOSMALFORMED -eq 0 ]]; then",
          "                    verify_oracle_linux_subscription_status",
          "                else",
          "                    UPDATESERVICECONFIG=\"Not Healthy, official Oracle Linux repositories are not accessible\"",
          "                    REPOSENABLED=\"There was an error while accessing repositories enabled\"",
          "                fi",
          "                ;;",
          "            UBUNTU_*)",
          "                REPOSMALFORMED=0",
          "                REPOSENABLED=\"$(timeout 600 apt-get update --error-on=any 2>/dev/null | grep  http | awk -F \" \" '{print $3}')\" || REPOSMALFORMED=$?",
          "                if [[ $REPOSMALFORMED -eq 0 ]]; then",
          "                    verify_ubuntu_subscription_status",
          "                else",
          "                    UPDATESERVICECONFIG=\"Not Healthy, official Ubuntu repositories are not accessible\"",
          "                    REPOSENABLED=\"There was an error while accessing repositories enabled\"",
          "                fi",
          "                ;;",
          "        *)",
          "            UPDATESERVICECONFIG=\"Not Healthy, OS not supported\"",
          "            ;;",
          "    esac",
          "}",
          "",
          "# Verifies the integrity of the package manager database",
          "verify_package_manager_db() {",
          "    OS_VERSION=$1",
          "    RPM_CORRUPT_PACKAGES=0",
          "    DPKG_CORRUPT_PACKAGES=1",
          "    echo \"Checking for package manager corruption started.\"",
          "",
          "    case \"$OS_VERSION\" in",
          "        RHEL_7|RHEL_8|RHEL_9|CENTOS_6|CENTOS_7|CENTOS_9|ALMA_8|ALMA_9|AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3|ORACLE_LINUX_7|ORACLE_LINUX_8|ORACLE_LINUX_9|SLES_12|SLES_15)",
          "            echo \"Checking for rpmdb corruption for $OS_VERSION.\"",
          "            if command -v /usr/lib/rpm/rpmdb_verify >/dev/null 2>&1; then",
          "                timeout 600 /usr/lib/rpm/rpmdb_verify -q /var/lib/rpm/Packages 2>/dev/null || RPM_CORRUPT_PACKAGES=$?",
          "            else",
          "                timeout 600 rpm --verifydb 2>/dev/null || RPM_CORRUPT_PACKAGES=$?",
          "            fi",
          "            if [[ $RPM_CORRUPT_PACKAGES -ne 0 ]]; then",
          "                echo \"RPM database corruption detected.\"",
          "            fi",
          "            ;;",
          "        UBUNTU_*)",
          "            echo \"Checking for dpkg corruption for Ubuntu.\"",
          "            dpkg_output=()",
          "            corrupt_package_count=0",
          "            while IFS= read -r line; do",
          "            dpkg_output+=(\"$line\")",
          "            if [[ $line =~ ^(iF|un|iU|ih) ]]; then",
          "                corrupt_package_count=$((corrupt_package_count + 1))",
          "            fi",
          "            done < <(dpkg -l 2>/dev/null)",
          "            if [[ $corrupt_package_count -gt 0 ]]; then",
          "                echo \"DPKG residual/half-configured packages detected.\"",
          "                DPKG_CORRUPT_PACKAGES=0",
          "            else",
          "                echo \"No corrupt packages found.\"",
          "            fi",
          "            ;;",
          "        *)",
          "            echo \"Unsupported OS version for verify_package_manager_db: $OS_VERSION\"",
          "            ;;",
          "    esac",
          "    echo \"Checking for package manager corruption complete.\"",
          "}",
          "",
          "# Verify if the update dry run succeeds",
          "verify_update_dry_run() {",
          "    OS_VERSION=$1",
          "",
          "    case \"$OS_VERSION\" in",
          "        RHEL_7|RHEL_8|RHEL_9|CENTOS_6|CENTOS_7|CENTOS_9|ALMA_8|ALMA_9|AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3|ORACLE_LINUX_7|ORACLE_LINUX_8|ORACLE_LINUX_9)",
          "            echo \"Asserting the yum/dnf dry run for $OS_VERSION.\"",
          "            YUMUPDATESTATUS=\"Succeeded\"",
          "",
          "            if command -v yum >/dev/null 2>&1; then",
          "                if ! timeout 600 yum -y update --setopt=tsflags=test --setopt=skip_if_unavailable=False >/dev/null 2>&1; then",
          "                    YUMUPDATESTATUS=\"Failed\"",
          "                fi",
          "            elif command -v dnf >/dev/null 2>&1; then",
          "                if ! timeout 600 dnf -y update --setopt=tsflags=test --setopt=skip_if_unavailable=False >/dev/null 2>&1; then",
          "                    YUMUPDATESTATUS=\"Failed\"",
          "                fi",
          "            else",
          "                YUMUPDATESTATUS=\"Failed\"",
          "                echo \"Neither YUM nor DNF found.\"",
          "            fi",
          "            echo \"Asserting the yum/dnf dry run for $OS_VERSION complete.\"",
          "            ;;",
          "        SLES_12|SLES_15)",
          "            echo \"Asserting the zypper dry run for SLES.\"",
          "            YUMUPDATESTATUS=\"Succeeded\"",
          "",
          "            if ! timeout 600 zypper --non-interactive update --dry-run --download-only >/dev/null 2>&1; then",
          "                YUMUPDATESTATUS=\"Failed\"",
          "            fi",
          "            echo \"Asserting the zypper dry run for SLES complete.\"",
          "            ;;",
          "        UBUNTU_*)",
          "            echo \"Asserting the apt dry run for Ubuntu.\"",
          "            YUMUPDATESTATUS=\"Succeeded\"",
          "",
          "            if ! apt-get update --error-on=any >/dev/null 2>&1; then",
          "                YUMUPDATESTATUS=\"Failed\"",
          "            elif ! apt-get -s upgrade >/dev/null 2>&1; then",
          "                YUMUPDATESTATUS=\"Failed\"",
          "            fi",
          "            echo \"Asserting the apt dry run for Ubuntu complete.\"",
          "            ;;",
          "        *)",
          "            echo \"Unsupported OS version for dry run: $OS_VERSION\"",
          "            YUMUPDATESTATUS=\"Failed\"",
          "            ;;",
          "    esac",
          "}",
          "",
          "# Verify if proxy is setup on the instance",
          "verify_proxy_setup() {",
          "    echo \"Asserting the proxy setup...\"",
          "    YUMPROXY=1",
          "    SYSTEMPROXY=1",
          "    APTPROXY=1",
          "",
          "    if ! grep ^proxy /etc/yum.conf >/dev/null 2>&1; then",
          "        YUMPROXY=0",
          "    fi",
          "",
          "    if ! env | grep -i proxy >/dev/null 2>&1; then",
          "        SYSTEMPROXY=0",
          "    fi",
          "",
          "    if ! grep ^proxy /etc/apt/apt.conf >/dev/null 2>&1; then",
          "        APTPROXY=0",
          "    fi",
          "",
          "    if [[ $YUMPROXY -eq 1 || $SYSTEMPROXY -eq 1 || $APTPROXY -eq 1 ]]; then",
          "        PROXYSTATUS=\"[Warning] Proxy configuration found on System. Please check the proxy settings in Yum (/etc/yum.conf or /etc/apt/apt.conf) and Env (env).\"",
          "    else",
          "        PROXYSTATUS=\"Proxy Not Configured.\"",
          "    fi",
          "",
          "    echo \"Asserting the proxy setup complete.\"",
          "}",
          "",
          "# Verify Package manager transaction",
          "verify_package_manager_transaction() {",
          "    OS_VERSION=$1",
          "    PACKAGEMANAGERSTATE=\"Healthy\"",
          "",
          "    case \"$OS_VERSION\" in",
          "        RHEL_7|RHEL_8|RHEL_9|CENTOS_6|CENTOS_7|CENTOS_9|ALMA_8|ALMA_9|AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3|ORACLE_LINUX_7|ORACLE_LINUX_8|ORACLE_LINUX_9|SLES_12|SLES_15)",
          "            if [[ $RPM_CORRUPT_PACKAGES -ne 0 ]]; then",
          "                PACKAGEMANAGERSTATE=\"Not Healthy, Package manager transaction did not complete successfully or the RPM DB is corrupted\"",
          "            fi",
          "            ;;",
          "        UBUNTU_*)",
          "            if [[ $DPKG_CORRUPT_PACKAGES -eq 0 ]]; then",
          "                PACKAGEMANAGERSTATE=\"Not Healthy, Package manager transaction did not complete successfully or the DPKG DB is corrupted\"",
          "            fi",
          "            ;;",
          "        *)",
          "            echo \"Package manager corruption check not applicable for this OS: $OS_VERSION\"",
          "            ;;",
          "    esac",
          "}",
          "",
          "# Checks for rpm database corruption and performs a yum transaction test",
          "verify_update_service() {",
          "    OS_VERSION=$1",
          "    echo \"Asserting the update service...\"",
          "",
          "    TOKEN_HEADER=\":\"",
          "    RPM_CORRUPT_PACKAGES=0",
          "    DPKG_CORRUPT_PACKAGES=1",
          "    UPDATESERVICECONFIG=\"Healthy\"",
          "",
          "    # Validate license",
          "    validate_license \"$OS_VERSION\"",
          "",
          "    # Verify the package manager database",
          "    verify_package_manager_db \"$OS_VERSION\"",
          "",
          "    # Verify the package manager transaction",
          "    verify_package_manager_transaction \"$OS_VERSION\"",
          "",
          "    echo \"Asserting the update service complete.\"",
          "}",
          "",
          "# Verify ELS (Extended Life Cycle Support)",
          "verify_extended_support() {",
          "    OS_VERSION=$1",
          "",
          "    echo \"Validating ELS (Extended Life Cycle Support)\"",
          "",
          "    case \"$OS_VERSION\" in",
          "        RHEL_7)",
          "            ELS_STATUS=$(timeout 600 yum repolist 2>/dev/null) || ELS_STATUS=\"Error\"",
          "            if echo \"$ELS_STATUS\" | grep -qw \"rhel-7-server-els\"; then",
          "                ELS_STATUS=\"ELS repository is enabled.\"",
          "            else",
          "                ELS_STATUS=\"ELS repository is not enabled.\"",
          "            fi",
          "            ;;",
          "        UBUNTU_16|UBUNTU_18)",
          "            ELS_STATUS=$(timeout 600 /usr/bin/ua status 2>/dev/null) || ELS_STATUS=\"Error\"",
          "            if echo \"$ELS_STATUS\" | grep -q \"ENTITLED\"; then",
          "                ELS_STATUS=\"ELS repository is enabled.\"",
          "            else",
          "                ELS_STATUS=\"ELS repository is not enabled.\"",
          "            fi",
          "            ;;",
          "        *)",
          "            ELS_STATUS=\"ELS validation not applicable for this OS.\"",
          "            ;;",
          "    esac",
          "",
          "    echo \"Validation of ELS (Extended Life Cycle Support) complete.\"",
          "}",
          "",
          "# Verify if the instance is in the domain",
          "ad_binding_status() {",
          "    echo \"Asserting the ad binding service.\"",
          "    DOMAINJOINQUERY=0",
          "    ACCESSVALIDATION=\"Validation failed\"",
          "",
          "    if [ -f /opt/pbis/bin/domainjoin-cli ]; then",
          "        DJ_QUERY=$(/opt/pbis/bin/domainjoin-cli query) || DOMAINJOINQUERY=$?",
          "        DJ_QUERY=$(echo ${DJ_QUERY^^})",
          "        # Single hostname call - derive both variables from same source",
          "        FULL_HOSTNAME=$(hostname --fqdn)",
          "        HOST_WITH_FQDN=$(echo ${FULL_HOSTNAME^^})",
          "        HOSTNAME_UPPERCASE=$(echo ${FULL_HOSTNAME%%.*} | tr '[:lower:]' '[:upper:]')",
          "        DOMAIN_CHECK=$(echo $HOST_WITH_FQDN | sed 's/'$HOSTNAME_UPPERCASE.'//')",
          "",
          "        # Guard against edge case where hostname --fqdn returns no domain",
          "        if [[ -z \"$DOMAIN_CHECK\" ]] || [[ \"$DOMAIN_CHECK\" == \"$HOST_WITH_FQDN\" ]]; then",
          "            ACCESSVALIDATION=\"Validation failed\"",
          "        elif match=$(echo $DJ_QUERY | awk -F '=' '{print $3}' | awk -F ' ' '{print $1}' | grep -ic $DOMAIN_CHECK); then",
          "            if [[ $DOMAINJOINQUERY -eq 0 ]] && [[ $match -eq 1 ]]; then",
          "                ACCESSVALIDATION=\"Validation succeeded\"",
          "            fi",
          "        fi",
          "    fi",
          "    echo \"Asserting the ad binding service complete.\"",
          "}",
          "",
          "# Function to check for duplicate packages.",
          "check_duplicate_packages() {",
          "    OS_VERSION=$1",
          "    DUPLICATE_PACKAGES=\"\"",
          "    echo \"Checking for duplicate packages.\"",
          "",
          "    case \"$OS_VERSION\" in",
          "        AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3|ALMA_8|ALMA_9|CENTOS_6|CENTOS_7|CENTOS_9|RHEL_7|RHEL_8|RHEL_9|ORACLE_LINUX_7|ORACLE_LINUX_8|ORACLE_LINUX_9)",
          "            if command -v package-cleanup >/dev/null 2>&1; then",
          "                DUPLICATE_PACKAGES=$(timeout 600 package-cleanup --dupes 2>/dev/null | grep -E '.*\\.(x86_64|noarch|i686|armv7hl|aarch64|ppc64le|ppc|ppc64|s390x)$' | tr '\\n' ' '|| DUPLICATE_PACKAGES=\"No duplicate packages found using package-cleanup.\") 2>/dev/null",
          "            elif command -v dnf >/dev/null 2>&1; then",
          "                DUPLICATE_PACKAGES=$(timeout 600 dnf repoquery --duplicates 2>/dev/null | grep -E '.*\\.(x86_64|noarch|i686|armv7hl|aarch64|ppc64le|ppc|ppc64|s390x)$' | tr '\\n' ' ' || DUPLICATE_PACKAGES=\"No duplicate packages found using dnf repoquery.\") 2>/dev/null",
          "            else",
          "                DUPLICATE_PACKAGES=\"Neither DNF nor package-cleanup not found.\"",
          "            fi",
          "            ;;",
          "        UBUNTU_*)",
          "            DUPLICATE_PACKAGES=$(timeout 600 dpkg -l 2>/dev/null | awk '/^ii/ {print $2 \"=\" $3}' | sort | uniq -D | uniq -c | awk '$1 > 1 {print $2}'| tr '\\n' ' ' || DUPLICATE_PACKAGES=\"No duplicate packages found on Ubuntu\")",
          "            ;;",
          "        SLES_12|SLES_15)",
          "            DUPLICATE_PACKAGES=$(timeout 600 rpm -qa --queryformat '%{NAME}-%{VERSION}.%{ARCH}\\n' 2>/dev/null | sort | uniq -D | grep -v \"kernel\" | tr '\\n' ' ') || DUPLICATE_PACKAGES=\"No duplicate packages found on SUSE\"",
          "            ;;",
          "        *)",
          "            DUPLICATE_PACKAGES=\"No supported package manager found for checking duplicate packages.\"",
          "            ;;",
          "    esac",
          "",
          "    echo \"Duplicate packages check complete.\"",
          "}",
          "",
          "# Function to check for obsolete packages.",
          "check_obsolete_packages() {",
          "    OS_VERSION=$1",
          "    echo \"Checking for obsolete packages...\"",
          "    OBSOLETE_PACKAGES=\"\"",
          "",
          "    case \"$OS_VERSION\" in",
          "        AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3|ALMA_8|ALMA_9|CENTOS_6|CENTOS_7|CENTOS_9|RHEL_7|RHEL_8|RHEL_9|ORACLE_LINUX_7|ORACLE_LINUX_8|ORACLE_LINUX_9)",
          "            if command -v yum >/dev/null 2>&1; then",
          "                OBSOLETE_PACKAGES=$(timeout 600 yum list obsoletes 2>/dev/null | grep -E \"^[^[:space:]]+\\.(x86_64|noarch|i686|armv7hl|aarch64|ppc64le|s390x)\" | awk '{print $1\"-\"$2}' | tr '\\n' ' ' || OBSOLETE_PACKAGES=\"No obsolete packages found using YUM.\") 2>/dev/null",
          "            elif command -v dnf >/dev/null 2>&1; then",
          "                OBSOLETE_PACKAGES=$(timeout 600 dnf list obsoletes 2>/dev/null | grep -E \"^[^[:space:]]+\\.(x86_64|noarch|i686|armv7hl|aarch64|ppc64le|s390x)\" | awk '{print $1\"-\"$2}' | tr '\\n' ' ' || OBSOLETE_PACKAGES=\"No obsolete packages found using DNF.\") 2>/dev/null",
          "            else",
          "                OBSOLETE_PACKAGES=\"Neither YUM nor DNF found.\"",
          "            fi",
          "            ;;",
          "        UBUNTU_*)",
          "            OBSOLETE_PACKAGES=\"Obsolete check not applicable for this OS.\"",
          "            ;;",
          "        SLES_12|SLES_15)",
          "            OBSOLETE_PACKAGES=\"Obsolete check not applicable for this OS.\"",
          "            ;;",
          "        *)",
          "            OBSOLETE_PACKAGES=\"No supported package manager found.\"",
          "            ;;",
          "    esac",
          "",
          "    echo \"Obsolete packages check complete.\"",
          "}",
          "",
          "# Function to check for package version lock.",
          "check_package_version_lock() {",
          "    OS_VERSION=$1",
          "    echo \"Checking for package version lock.\"",
          "    VERSION_LOCK_STATUS=\"\"",
          "    EXCLUDE_PARAMETER_STATUS=\"\"",
          "",
          "    case \"$OS_VERSION\" in",
          "        AMAZON_LINUX_1|AMAZON_LINUX_2|AMAZON_LINUX_3|ALMA_8|ALMA_9|CENTOS_6|CENTOS_7|CENTOS_9|RHEL_7|RHEL_8|RHEL_9|ORACLE_LINUX_7|ORACLE_LINUX_8|ORACLE_LINUX_9)",
          "            if grep -q \"enabled = 1\" /etc/yum/pluginconf.d/versionlock.conf 2>/dev/null; then",
          "                if [ -s /etc/yum/pluginconf.d/versionlock.list ]; then",
          "                    VERSION_LOCK_STATUS=$(cat /etc/yum/pluginconf.d/versionlock.list 2>/dev/null | tr '\\n' ' ')",
          "                else",
          "                    VERSION_LOCK_STATUS=\"No packages are version locked.\"",
          "                fi",
          "            else",
          "                VERSION_LOCK_STATUS=\"Version lock is not enabled or configuration not found.\"",
          "            fi",
          "            ",
          "            if [ -f /etc/yum.conf ]; then",
          "                if grep -q \"^exclude=\" /etc/yum.conf 2>/dev/null; then",
          "                    EXCLUDE_VALUE=$(grep \"^exclude=\" /etc/yum.conf | cut -d'=' -f2)",
          "                    if [ -n \"$EXCLUDE_VALUE\" ]; then",
          "                        EXCLUDE_PARAMETER_STATUS=\"Packages are excluded to update with value: $EXCLUDE_VALUE.\"",
          "                    else",
          "                        EXCLUDE_PARAMETER_STATUS=\"Packages are excluded and have no value.\"",
          "                    fi",
          "                else",
          "                    EXCLUDE_PARAMETER_STATUS=\"None of the packages are excluded from update.\"",
          "                fi",
          "            elif [ -f /etc/dnf/dnf.conf ]; then",
          "                if grep -q \"^exclude=\" /etc/dnf/dnf.conf 2>/dev/null; then",
          "                    EXCLUDE_VALUE=$(grep \"^exclude=\" /etc/dnf/dnf.conf | cut -d'=' -f2)",
          "                    if [ -n \"$EXCLUDE_VALUE\" ]; then",
          "                        EXCLUDE_PARAMETER_STATUS=\"Packages are excluded to update with value: $EXCLUDE_VALUE.\"",
          "                    else",
          "                        EXCLUDE_PARAMETER_STATUS=\"Packages are excluded and have no value.\"",
          "                    fi",
          "                else",
          "                    EXCLUDE_PARAMETER_STATUS=\"None of the packages are excluded from update.\"",
          "                fi",
          "            else",
          "                EXCLUDE_PARAMETER_STATUS=\"/etc/yum.conf or /etc/dnf/dnf.conf not found.\"",
          "            fi",
          "            ;;",
          "        UBUNTU_*)",
          "            VERSION_LOCK_STATUS=$(timeout 600 apt-mark showhold 2>/dev/null | tr '\\n' ' ')",
          "            if [ -z \"$VERSION_LOCK_STATUS\" ]; then",
          "                    VERSION_LOCK_STATUS=\"No packages are version locked.\"",
          "            fi",
          "            ;;",
          "        SLES_12|SLES_15)",
          "            if [ -f /etc/zypp/locks ]; then",
          "                if [ -s /etc/zypp/locks ]; then",
          "                    VERSION_LOCK_STATUS=$(timeout 600 zypper locks 2>/dev/null |awk -F\"|\" '{print $2}'|grep -v Name|tr '\\n' ' ')",
          "                else",
          "                    VERSION_LOCK_STATUS=\"No packages are version locked.\"",
          "                fi",
          "            else",
          "                VERSION_LOCK_STATUS=\"Version lock configuration not found.\"",
          "            fi",
          "            ;;",
          "        *)",
          "            VERSION_LOCK_STATUS=\"No supported package manager found for checking version locks.\"",
          "            ;;",
          "    esac",
          "",
          "    echo \"$VERSION_LOCK_STATUS\"",
          "    echo \"$EXCLUDE_PARAMETER_STATUS\"",
          "    echo \"Package version lock check complete.\"",
          "}",
          "",
          "# Function to check for YUM variable releasever.",
          "package_manager_releasever() {",
          "    OS_VERSION=$1",
          "    PYTHON_PATH=$2",
          "    echo \"Checking for YUM variable releasever.\"",
          "",
          "    for PYTHON_PATH in \"${PYTHON_PATHS[@]}\"",
          "    do",
          "        if [ -x \"$PYTHON_PATH\" ]; then",
          "            case \"$OS_VERSION\" in",
          "                AMAZON_LINUX_3|CENTOS_9|RHEL_8|RHEL_9)",
          "                    if $PYTHON_PATH -c 'import dnf, json' &>/dev/null; then",
          "                        RELEASER_STATUS=$($PYTHON_PATH -c 'import dnf, json; db = dnf.dnf.Base(); print(json.dumps(db.conf.substitutions, indent=2))' 2>&1 | grep -i releasever | awk -F': ' '{print $2}' | tr -d '\",')",
          "                    else",
          "                        RELEASER_STATUS=\"Error: $PYTHON_PATH does not have the 'dnf' module installed.\"",
          "                    fi",
          "                    ;;",
          "                RHEL_7)",
          "                    RELEASER_STATUS=$(python -c 'import yum, json; yb = yum.YumBase(); print json.dumps(yb.conf.yumvar, indent=2)' 2>/dev/null | grep -i releasever | awk -F': ' '{print $2}' | tr -d '\",') || RELEASER_STATUS=\"Unable to retrieve YUM variable releasever using.\"",
          "                    ;;",
          "                *)",
          "                    RELEASER_STATUS=\"Not applicable OS for checking YUM variable releasever.\"",
          "                    ;;",
          "            esac",
          "        fi",
          "    done",
          "    echo \"Checking for YUM variable releasever complete.\"",
          "}",
          "",
          "# Collect data",
          "collect_patch_prerequisites() {",
          "    OS_STATUS=\"OK\"",
          "    UPDATESERVICECONFIG=\"Healthy\"  # Default value if OS is recognized",
          "",
          "    # Call the OS detection function",
          "    OS_VERSION=$(DETECT_OS_VERSION)",
          "",
          "    handle_os_version \"$OS_VERSION\"",
          "",
          "    # Store the OS status in the UpdateServiceConfigurationStatus field",
          "    if [[ \"$OS_STATUS\" != \"OK\" ]]; then",
          "        UPDATESERVICECONFIG=\"$OS_STATUS\"",
          "",
          "        # Array of variable names",
          "        variables=(",
          "            METADATAACCESS",
          "            VOLUMESPACECRITERIA",
          "            ROOTDISKFREE",
          "            VARLOGDISKFREE",
          "            VARCACHEDISKFREE",
          "            BOOTDISKFREE",
          "            FILESYSTEM_CORRUPTION_CHECK_XFS_EXT4",
          "            CREDSACCESSIBLE",
          "            ACCESSVALIDATION",
          "            PROXYSTATUS",
          "            FOUND_PYTHON_VERSION",
          "        )",
          "",
          "        # Default value to assign",
          "        default_value=\"N/A\"",
          "",
          "        # Loop through the array and assign the default value",
          "        for var in \"${variables[@]}\"; do",
          "            declare \"$var=$default_value\"",
          "        done",
          "    else",
          "        verify_proxy_setup",
          "        verify_space_available",
          "        verify_xfs_ext4_filesystems_integrity",
          "        check_python_versions",
          "        check_package_version_lock \"$OS_VERSION\"",
          "",
          "        # Set initial status to a default value",
          "        UPDATE_SERVICE_STATUS=\"Healthy\"",
          "",
          "        # Call the verify_update_service function and capture its status",
          "        verify_update_service \"$OS_VERSION\"",
          "        UPDATE_SERVICE_STATUS=$UPDATESERVICECONFIG",
          "",
          "        # Check the status and proceed accordingly",
          "        if [[ \"$UPDATE_SERVICE_STATUS\" == \"Healthy\" || \"$UPDATE_SERVICE_STATUS\" == \"RHEL RHUI configuration is healthy.\" || \"$UPDATE_SERVICE_STATUS\" == \"RHEL subscription manager is healthy.\" ]]; then",
          "            verify_extended_support \"$OS_VERSION\"",
          "            verify_update_dry_run \"$OS_VERSION\"",
          "            check_obsolete_packages \"$OS_VERSION\"",
          "            check_duplicate_packages \"$OS_VERSION\"",
          "            package_manager_releasever \"$OS_VERSION\" \"$PYTHON_PATH_USED\"",
          "        else",
          "            echo \"Skipping check extended support, verify update dry run, check obsolete packages, check duplicate packages and package manager releasever due to failed verify update service.\"",
          "        fi",
          "",
          "        assert_aws_credentials_s3_connectivity",
          "        ad_binding_status",
          "        get_ssm_command_url",
          "    fi",
          "",
          "    DATE=\"$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")\"",
          "    PATCH_PREREQUISITES_DATA=$(cat << EOF",
          "{",
          "    \"SchemaVersion\": \"9.0\",",
          "    \"TypeName\": \"Custom:AmsPatchConfiguration\",",
          "    \"CaptureTime\": \"$DATE\",",
          "    \"Content\":",
          "        {",
          "            \"UpdateServiceConfigurationStatus\": \"$UPDATESERVICECONFIG\",",
          "            \"PackageManagerCorruptionCheck\": \"${PACKAGEMANAGERSTATE:-}\",",
          "            \"Ec2MetadataServiceStatus\": \"$METADATAACCESS\",",
          "            \"WindowsUpdateServiceStartMode\": \"N/A\",",
          "            \"WindowsFirewallServiceStartMode\": \"N/A\",",
