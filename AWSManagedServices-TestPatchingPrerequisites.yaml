          "        \"us-gov-west-1\") echo \"3165e4580\" ;; # PDT",
          "        \"ap-south-1\") echo \"cb7c62ff9\" ;;    # BOM",
          "        \"us-west-1\") echo \"8badb4304\" ;;     # SFO",
