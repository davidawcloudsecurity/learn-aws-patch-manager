---
description: |-
  ## Intent
  Scale out an Amazon EC2 Auto Scaling group increasing the number of Amazon EC2 instances.

  ## Type
  SOP

  ## Risk
  Small

  ## Requirements
  * Available ASG

  ## Permission required for AutomationAssumeRole
  * autoscaling:UpdateAutoScalingGroup
  * autoscaling:DescribeAutoScalingGroups
  * autoscaling:StartInstanceRefresh
  * autoscaling:DescribeInstanceRefreshes
  * ec2:DescribeLaunchTemplateVersions
  * ec2:DescribeInstanceTypeOfferings
  * ec2:CreateLaunchTemplateVersion
  * ec2:DeleteLaunchTemplateVersions
  * ec2:RunInstances
  * iam:PassRole

  ## Supports Rollback
  Yes

  ## Cancellation behavior
  Fail

  ## Inputs
  ### AutoScalingGroupName:
  * type: String
  * description: (Required) The ASG Group Name
  ### AutomationAssumeRole:
  * type: String
  * description: 
      (Optional) The ARN of the role that allows Automation to perform
      the actions on your behalf. If no role is specified, Systems Manager Automation
      uses your IAM permissions to run this document.
      default: ''

  ## Details
  The document fetches the existing ASG capacity, calculates the new capacity for the scale-out, 
  and then updates the ASG capacity to the new one and waits for the scale-out to complete.

  ## Steps executed in normal flow
    * RecordStartTime
    * FetchExistingCapacity
    * CalculateNewCapacity
    * UpdateCapacity
    * WaitForScaleOut
    * OutputRecoveryTime

  ## Outputs
  * `NewDesiredCapacity`: The new desired capacity for the ASG
  * `NewMaxSize`: The new max size for the ASG
  * `OutputRecoveryTime.RecoveryTime`: recovery time in seconds
schemaVersion: "0.3"
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  Dryrun:
    type: Boolean
    default: true
    description: (Optional) Dryrun indicates a testing run, changes will be rolled back.
    allowedPattern: "^(true|false)$"
  AutomationAssumeRole:
    type: String
    description: (Required) The ARN of the role that allows Automation to perform the actions on your behalf.
    allowedPattern: "^arn:(aws|aws-cn|aws-us-gov|aws-iso|aws-iso-b):[a-zA-Z0-9-]+:[a-zA-Z0-9-]*:[0-9]{12}:[^\n\r]*$"
  AutoScalingGroupName:
    type: String
    description: (Required) The Name of the ASG to scaleOut
    # Any ASCII character 33 to 126 including most punctuation characters, digits, and upper and lowercased letters except colon(:)
    allowedPattern: "^[\x21-\x39\x3B-\x7E]+$"
outputs:
  - OutputRecoveryTime.RecoveryTime
mainSteps:
  - name: RecordStartTime
    description: Start recording execution time
    action: "aws:executeScript"
    inputs:
      Runtime: python3.11
      Handler: script_handler
      Script: |-
        def script_handler(events, context):
          from datetime import datetime, timezone
          return datetime.now(timezone.utc).isoformat()
    outputs:
      - Name: StartTime
        Selector: $.Payload
        Type: String
  - name: FetchExistingCapacity
    description: Fetch the existing desired and max instance capacity of the Amazon ASG.
    action: "aws:executeAwsApi"
    inputs:
      Service: autoscaling
      Api: DescribeAutoScalingGroups
      AutoScalingGroupNames:
        - "{{AutoScalingGroupName}}"
    outputs:
      - Name: CurrentDesiredCapacity
        Selector: "$.AutoScalingGroups[0].DesiredCapacity"
        Type: Integer
      - Name: CurrentMaxSize
        Selector: "$.AutoScalingGroups[0].MaxSize"
        Type: Integer
  - name: CalculateNewCapacity
    description: Calculate the new desired and max instance capacity for the Amazon ASG.
    action: "aws:executeScript"
    inputs:
      Runtime: python3.11
      Handler: script_handler
      InputPayload:
        CurrentDesiredCapacity: "{{FetchExistingCapacity.CurrentDesiredCapacity}}"
        CurrentMaxSize: "{{FetchExistingCapacity.CurrentMaxSize}}"
      Script: |-
        import math
        def script_handler(events, context):
          return {
              'NewDesiredCapacity': math.ceil(events['CurrentDesiredCapacity'] * 1.5),
              'NewMaxSize': max(math.ceil(events['CurrentDesiredCapacity'] * 1.5), events['CurrentMaxSize'])
          }

    outputs:
      - Name: NewDesiredCapacity
        Selector: $.Payload.NewDesiredCapacity
        Type: Integer
      - Name: NewMaxSize
        Selector: $.Payload.NewMaxSize
        Type: Integer
  - name: UpdateCapacity
    action: "aws:executeAwsApi"
    description: Update Capacity on an Asg
    inputs:
      Service: autoscaling
      Api: UpdateAutoScalingGroup
      AutoScalingGroupName: "{{AutoScalingGroupName}}"
      DesiredCapacity: "{{CalculateNewCapacity.NewDesiredCapacity}}"
      MaxSize: "{{CalculateNewCapacity.NewMaxSize}}"
  - name: WaitForScaleOut
    action: "aws:executeScript"
    inputs:
      Runtime: python3.11
      Handler: wait_for_in_service
      InputPayload:
        AutoScalingGroupName: "{{AutoScalingGroupName}}"
        NewDesiredCapacity: "{{CalculateNewCapacity.NewDesiredCapacity}}"
      Script: |-
        import logging
        import random
        import time
        from math import ceil
        
        import boto3
        from botocore.config import Config
        
        logger = logging.getLogger(__name__)
        logger.setLevel(logging.INFO)
        
        

        def wait_for_in_service(events, context):
            client = boto3.client('autoscaling')
            while True:
                res = client.describe_auto_scaling_groups(AutoScalingGroupNames=[events['AutoScalingGroupName']])
                instances = res['AutoScalingGroups'][0]['Instances']
                num_in_service = sum(instance['LifecycleState'] == 'InService' for instance in instances)
                if num_in_service >= events['NewDesiredCapacity']:
                    return True
                time.sleep(15)
        
        

    description: Wait for Asg to update capacity
    timeoutSeconds: 1200
    maxAttempts: 4
  - name: OutputRecoveryTime
    description: Calculate execution time
    action: "aws:executeScript"
    inputs:
      Runtime: python3.11
      Handler: script_handler
      Script: |-
        def script_handler(events, context):
          from datetime import datetime, timezone
          from dateutil import parser
          return (datetime.now(timezone.utc) - parser.parse(events['StartTime'])).seconds
      InputPayload:
        StartTime: "{{RecordStartTime.StartTime}}"
    outputs:
      - Name: RecoveryTime
        Selector: $.Payload
        Type: Integer
  - name: DryrunBranch
    description: If this is NOT a dryrun, skip to the end. If it is a dryrun, proceed to rollback.
    action: "aws:branch"
    inputs:
      Choices:
        - NextStep: EmptyStepForEnd
          Variable: "{{Dryrun}}"
          BooleanEquals: false
        - NextStep: RollBackCapacityChange
          Variable: "{{Dryrun}}"
          BooleanEquals: true
  - name: RollBackCapacityChange
    action: "aws:executeAwsApi"
    maxAttempts: 3
    description: Rollback Capacity on an Amazon ASG.
    inputs:
      Service: autoscaling
      Api: UpdateAutoScalingGroup
      AutoScalingGroupName: "{{AutoScalingGroupName}}"
      DesiredCapacity: "{{FetchExistingCapacity.CurrentDesiredCapacity}}"
      MaxSize: "{{FetchExistingCapacity.CurrentMaxSize}}"
  - name: EmptyStepForEnd
    description: An empty step to end the execution.
    action: "aws:sleep"
    isEnd: true
    inputs:
      Duration: "PT1S"
